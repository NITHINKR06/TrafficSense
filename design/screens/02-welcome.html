<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficSense · Welcome</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0} button{font-family:inherit;cursor:pointer} a{text-decoration:none}</style>

<style>body{margin:0}</style>
<style>html,body{margin:0;background:#E8EBEE}#app{display:inline-block;min-width:100%}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-Welcome">
<div style="width:900px;height:952px;box-sizing:border-box;padding:32px;display:flex;gap:56px;background:#E8EBEE;font-family:Inter,system-ui,sans-serif">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px;width:390px">
<div style="height:28px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#4B555E">{{t.name}}</div>
<div style="width:390px;height:844px;border-radius:40px;overflow:hidden;position:relative;background:{{t.bg}};box-shadow:0 0 0 1px {{t.frame}};padding:16px 20px 28px;box-sizing:border-box;display:flex;flex-direction:column">

<div style="display:flex;align-items:center;justify-content:space-between;height:44px">
<div style="display:flex;align-items:center;gap:10px">
<img src="../assets/icon.png" alt="" style="width:32px;height:32px;border-radius:8px;display:block">
<span style="font-size:16px;font-weight:650;letter-spacing:-.01em;color:{{t.tx}}">TrafficSense</span>
</div>
<a href="09-sign-in.html" style="height:44px;padding:0 4px;display:flex;align-items:center;font-size:15px;font-weight:600;color:{{t.tx}}">Sign in</a>
</div>

<div style="margin-top:12px;position:relative;height:420px;border-radius:32px;overflow:hidden;border:1px solid {{t.bd}}">
<dc-import name="MapBase" dark="{{t.dark}}" scene="route" offset="{{ 96 }}" hint-size="100%,420px"></dc-import>
<span style="position:absolute;top:16px;left:16px;height:36px;padding:0 12px;border-radius:18px;background:{{t.sf}};box-shadow:{{t.sh}};display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:{{t.tx}}"><span style="width:8px;height:8px;border-radius:50%;background:{{t.wnDot}}"></span>Flooding · Jyothi Circle</span>
<span style="position:absolute;left:16px;right:16px;bottom:16px;height:64px;border-radius:20px;background:{{t.sf}};box-shadow:{{t.sh}};display:flex;align-items:center;gap:12px;padding:0 16px">
<span style="width:36px;height:36px;border-radius:12px;background:{{t.acs}};display:flex;align-items:center;justify-content:center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.ac}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0M16 5a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></svg></span>
<span style="flex:1;display:flex;flex-direction:column;gap:1px"><span style="font-size:15px;font-weight:600;color:{{t.tx}}">18 min to Bejai</span><span style="font-size:12px;color:{{t.tx3}}">Avoids 1 report · arrive 10:32</span></span>
</span>
</div>

<h1 style="margin:28px 0 0;font-size:34px;line-height:38px;font-weight:650;letter-spacing:-.035em;color:{{t.tx}}">Know the road<br>before you go.</h1>
<p style="margin:10px 0 0;font-size:16px;line-height:23px;color:{{t.tx2}}">Live reports from Mangaluru commuters. Plan around floods, jams and closures.</p>

<div style="margin-top:auto;display:flex;flex-direction:column;gap:6px">
<a href="04-home.html" style="height:56px;border-radius:18px;background:{{t.ac}};color:{{t.onac}};font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px">Plan my route
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.onac}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></a>
<a href="05-live-map.html" style="height:48px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:{{t.tx}}">Explore the live map</a>
<p style="margin:2px 0 0;text-align:center;font-size:12px;color:{{t.tx3}}"><a href="14-privacy-legal.html" style="color:{{t.tx3}};text-decoration:underline">Terms</a> · <a href="14-privacy-legal.html" style="color:{{t.tx3}};text-decoration:underline">Privacy</a> · <a href="14-privacy-legal.html" style="color:{{t.tx3}};text-decoration:underline">Licenses</a></p>
</div>
</div>
</div>
</sc-for>
</div>
</template>
<template id="tpl-MapBase">
<div style="width:100%;height:100%;overflow:hidden;background:{{c.land}};font-family:Inter,system-ui,sans-serif">
<svg width="100%" height="100%" viewBox="0 {{vy}} 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of central Mangaluru">
<rect y="-300" width="390" height="1444" fill="{{c.land}}"/>
<ellipse cx="300" cy="250" rx="42" ry="28" fill="{{c.park}}"/>
<ellipse cx="128" cy="575" rx="32" ry="20" fill="{{c.park}}"/>
<ellipse cx="345" cy="520" rx="26" ry="36" fill="{{c.park}}"/>
<path d="M0 -300H80C66 -100 60 0 72 0C60 120 84 220 66 330C52 430 80 520 60 640C48 720 72 790 58 844C50 950 66 1050 60 1144H0Z" fill="{{c.water}}"/>
<path d="M66 170C140 150 200 190 260 160S360 120 390 140" stroke="{{c.water}}" stroke-width="16" fill="none"/>
<path d="M60 700C140 676 200 728 280 706S360 656 390 676" stroke="{{c.water}}" stroke-width="34" fill="none"/>
<g stroke="{{c.road}}" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M90 262H360M100 384H380M110 522H370M84 610H360M150 110V660M210 130V680M330 200V640M90 444C180 432 260 472 380 452M96 330C160 340 220 320 300 336M120 40H380M100 800H380"/>
</g>
<g fill="none" stroke-linecap="round">
<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.major}}" stroke-width="6"/>
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" stroke="{{c.major}}" stroke-width="6"/>
</g>
<g opacity="{{trafficOp}}" fill="none" stroke-linecap="round">
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" pathLength="100" stroke="{{c.warn}}" stroke-width="5" stroke-dasharray="0 22 20 100"/>
<path d="M250 0C240 140 300 260 290 400S330 600 300 844" pathLength="100" stroke="{{c.danger}}" stroke-width="5" stroke-dasharray="0 38 10 100"/>
<path d="M250 0C240 140 300 260 290 400S330 600 300 844" pathLength="100" stroke="{{c.warn}}" stroke-width="5" stroke-dasharray="0 48 12 100"/>
</g>
<g font-size="11" font-weight="500" fill="{{c.label}}" letter-spacing=".01em">
<text x="168" y="232">Urwa</text>
<text x="98" y="300">Ladyhill</text>
<text x="300" y="282">Bejai</text>
<text x="232" y="356">Kadri</text>
<text x="96" y="500">Hampankatta</text>
<text x="226" y="560">Kankanady</text>
<text x="300" y="636">Pumpwell</text>
<text x="118" y="752">Bolar</text>
<text x="146" y="418" font-size="14" font-weight="600">Mangaluru</text>
</g>

<g opacity="{{routeOp}}" fill="none" stroke-linecap="round">
<path d="M140 478C140 420 180 360 230 330S270 300 282 300" stroke="{{c.casingRoute}}" stroke-width="9"/>
<path d="M140 478C140 420 180 360 230 330S270 300 282 300" stroke="{{c.alt}}" stroke-width="5"/>
<path d="M140 478C170 470 190 440 215 420S250 330 282 300" stroke="{{c.casingRoute}}" stroke-width="12"/>
<path d="M140 478C170 470 190 440 215 420S250 330 282 300" stroke="{{c.route}}" stroke-width="7"/>
<circle cx="140" cy="478" r="8" fill="{{c.casingRoute}}" stroke="{{c.route}}" stroke-width="4"/>
<g transform="translate(282 300)">
<path d="M0 0C-3-5-11-11-11-19A11 11 0 1 1 11-19C11-11 3-5 0 0Z" fill="{{c.ink}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<circle cy="-19" r="4" fill="{{c.casingRoute}}"/>
</g>
</g>
<g opacity="{{bubbleOp}}" font-size="12" font-weight="600">
<rect x="226" y="400" width="62" height="26" rx="13" fill="{{c.route}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<text x="257" y="417.5" text-anchor="middle" fill="{{c.onRoute}}">18 min</text>
<rect x="104" y="340" width="62" height="26" rx="13" fill="{{c.bubble}}" stroke="{{c.bubbleBd}}" stroke-width="1"/>
<text x="135" y="357.5" text-anchor="middle" fill="{{c.ink}}">21 min</text>
<g transform="translate(206 432)">
<circle r="10" fill="{{c.warn}}" stroke="{{c.casingRoute}}" stroke-width="2.5"/>
<path d="M0-5v5M0 3.5v.5" stroke="{{c.casingRoute}}" stroke-width="2.2" stroke-linecap="round"/>
</g>
</g>

<g opacity="{{pinOp}}">
<g transform="translate(262 380)">
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.danger}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M-4.5-20h9" stroke="{{c.casingRoute}}" stroke-width="2.2" stroke-linecap="round"/>
</g>
<g transform="translate(176 604)">
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.neutral}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M-2-25h4l3 9h-10z" fill="none" stroke="{{c.casingRoute}}" stroke-width="1.8" stroke-linejoin="round"/>
</g>
<g transform="translate(212 505) scale(1.3)">
<ellipse cy="1" rx="6" ry="2" fill="{{c.ink}}" opacity=".18"/>
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.warn}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M0-27s4.5 4.5 4.5 7.5a4.5 4.5 0 0 1-9 0c0-3 4.5-7.5 4.5-7.5z" fill="{{c.casingRoute}}"/>
</g>
</g>
<g opacity="{{youOp}}">
<path d="M150 528 168 520 186 528 176 494H160Z" fill="{{c.route}}" opacity=".16" transform="rotate(200 168 520)"/>
<circle cx="168" cy="520" r="9" fill="{{c.route}}" stroke="{{c.casingRoute}}" stroke-width="3.5"/>
</g>
</svg>
</div>
</template>
<script src="../runtime/ts-runtime.js"></script>
<script>
TS.define('Welcome', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const T = {
      light:{dark:false,name:'Light',bg:'#F5F6F7',sf:'#FFFFFF',bd:'#E2E5E8',tx:'#121619',tx2:'#4B555E',tx3:'#68737D',ac:'#0B6B5F',acs:'#E2F0ED',onac:'#FFFFFF',wnDot:'#D27A12',frame:'#D9DDE1',sh:'0 1px 2px rgba(16,24,32,.06), 0 8px 24px rgba(16,24,32,.12)'},
      dark:{dark:true,name:'Dark',bg:'#0B0F10',sf:'#13181A',bd:'#252D30',tx:'#EEF2F3',tx2:'#A9B4B8',tx3:'#8A969B',ac:'#56C7B3',acs:'#0F2C28',onac:'#03211C',wnDot:'#F2AA55',frame:'#252D30',sh:'0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.5)'}
    };
    return { themes: [T.light, T.dark] };
  }
}
return Component;
}, 'tpl-Welcome');
TS.define('MapBase', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const scene = this.props.scene ?? 'traffic';
    const c = dark
      ? { land:'#121618', park:'#142019', water:'#0C1B22', road:'#1F2528', casing:'#121618', major:'#343C41', label:'#7C878E', route:'#56C7B3', onRoute:'#03211C', casingRoute:'#0B0F10', alt:'#4E595F', warn:'#F2AA55', danger:'#F7897D', neutral:'#A9B4B8', ink:'#EEF2F3', bubble:'#1B2124', bubbleBd:'#2E373B' }
      : { land:'#F2F3F0', park:'#E1EADB', water:'#CFE0E9', road:'#FFFFFF', casing:'#DDE0DA', major:'#FFFFFF', label:'#6B757E', route:'#0B6B5F', onRoute:'#FFFFFF', casingRoute:'#FFFFFF', alt:'#A3ACB3', warn:'#D27A12', danger:'#CC3B2E', neutral:'#4B555E', ink:'#121619', bubble:'#FFFFFF', bubbleBd:'#D5D9DD' };
    return {
      c,
      vy: this.props.offset ?? 0,
      routeOp: scene === 'route' || scene === 'preview' ? 1 : 0,
      bubbleOp: scene === 'route' ? 1 : 0,
      pinOp: scene === 'traffic' ? 1 : 0,
      trafficOp: scene === 'traffic' || scene === 'route' ? 1 : 0,
      youOp: scene === 'traffic' ? 1 : 0
    };
  }
}
return Component;
}, 'tpl-MapBase');
TS.mount('Welcome', document.getElementById('app'));
</script>
</body>
</html>

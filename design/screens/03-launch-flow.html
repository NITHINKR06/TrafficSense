<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficSense · Launch flow (prototype)</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0} button{font-family:inherit;cursor:pointer}
@keyframes lf-icon{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
@keyframes lf-rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes lf-road{from{background-position:0 0}to{background-position:-28px 0}}
.lf-icon{animation:lf-icon 700ms cubic-bezier(.32,.72,0,1) both}
.lf-word{animation:lf-rise 420ms cubic-bezier(0,0,0,1) 1150ms both}
.lf-tag{animation:lf-rise 420ms cubic-bezier(0,0,0,1) 1270ms both}
.lf-load{animation:lf-rise 420ms cubic-bezier(0,0,0,1) 560ms both}
.lf-dash{animation:lf-road 700ms linear infinite}
.lg-wrap{perspective:640px}
.lg{transform-origin:50% 60%;animation:lgTile 900ms cubic-bezier(.34,1.4,.64,1) both}
@keyframes lgTile{0%{opacity:0;transform:translateY(26px) rotateX(42deg) rotateZ(-8deg) scale(.55)}45%{opacity:1}100%{opacity:1;transform:none}}
.lg-hl{animation:lgL 700ms cubic-bezier(.22,1,.36,1) 220ms both,lgSwayL 4s ease-in-out 1.8s infinite}
.lg-hr{animation:lgR 700ms cubic-bezier(.22,1,.36,1) 280ms both,lgSwayR 4s ease-in-out 1.8s infinite}
@keyframes lgL{from{opacity:0;transform:translateX(-22px)}to{opacity:1;transform:none}}
@keyframes lgR{from{opacity:0;transform:translateX(22px)}to{opacity:1;transform:none}}
@keyframes lgSwayL{0%,100%{transform:none}50%{transform:translateX(-1.6px)}}
@keyframes lgSwayR{0%,100%{transform:none}50%{transform:translateX(1.6px)}}
.lg-edge{stroke-dasharray:100 100;animation:lgDraw 700ms cubic-bezier(.65,0,.35,1) 340ms both}
.lg-road{stroke-dasharray:100 100;animation:lgDraw 700ms cubic-bezier(.65,0,.35,1) 430ms both}
@keyframes lgDraw{from{stroke-dashoffset:100}to{stroke-dashoffset:0}}
.lg-lane{stroke-dasharray:5 6;animation:lgIn 260ms ease 1050ms both,lgLane 800ms linear 1050ms infinite}
@keyframes lgIn{from{opacity:0}to{opacity:1}}
@keyframes lgLane{from{stroke-dashoffset:0}to{stroke-dashoffset:11}}
.lg-pin{transform-box:fill-box;transform-origin:50% 100%;animation:lgFall 720ms linear 900ms both,lgHop 1800ms cubic-bezier(.45,0,.55,1) 2500ms infinite}
@keyframes lgFall{0%{opacity:0;transform:translateY(-74px) scale(.88,1.16);animation-timing-function:cubic-bezier(.55,0,1,.45)}12%{opacity:1}45%{transform:translateY(0) scale(.9,1.12);animation-timing-function:ease-out}56%{transform:translateY(0) scale(1.22,.76)}70%{transform:translateY(-11px) scale(.94,1.07);animation-timing-function:ease-in}82%{transform:translateY(0) scale(1.08,.9)}92%{transform:translateY(0) scale(.98,1.02)}100%{opacity:1;transform:none}}
@keyframes lgHop{0%{transform:none}10%{transform:translateY(0) scale(1.14,.84)}25%{transform:translateY(-16px) scale(.9,1.1)}40%{transform:translateY(-21px) scale(-1,1)}55%{transform:translateY(-16px) scale(1,1)}70%{transform:translateY(0) scale(1,1)}78%{transform:translateY(0) scale(1.16,.82)}88%{transform:translateY(0) scale(.97,1.04)}100%{transform:none}}
.lg-sh{transform-box:fill-box;transform-origin:center;animation:lgShFall 720ms linear 900ms both,lgShHop 1800ms cubic-bezier(.45,0,.55,1) 2500ms infinite}
@keyframes lgShFall{0%{opacity:0;transform:scale(.3)}45%{opacity:.32;transform:scale(1.25)}100%{opacity:.28;transform:none}}
@keyframes lgShHop{0%,10%{opacity:.28;transform:none}25%,55%{opacity:.1;transform:scale(.45)}70%{opacity:.32;transform:scale(1.2)}100%{opacity:.28;transform:none}}
.lg-rip,.lg-rip2{transform-box:fill-box;transform-origin:center;opacity:0}
.lg-rip{animation:lgRip1 900ms cubic-bezier(0,0,.2,1) 1224ms forwards,lgRip 1800ms linear 2500ms infinite}
.lg-rip2{animation:lgRip1 900ms cubic-bezier(0,0,.2,1) 1404ms forwards,lgRip 1800ms linear 2680ms infinite}
@keyframes lgRip1{0%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:scale(2.8)}}
@keyframes lgRip{0%,69%{opacity:0;transform:scale(.3)}70%{opacity:.8;transform:scale(.3)}100%{opacity:0;transform:scale(2.8)}}
.lw{display:inline-block;animation:lwRise 560ms cubic-bezier(.22,1,.36,1) both}
@keyframes lwRise{from{opacity:0;transform:translateY(18px) rotate(6deg)}to{opacity:1;transform:none}}
.lt{animation:ltTrack 900ms cubic-bezier(.22,1,.36,1) 1750ms both}
@keyframes ltTrack{from{opacity:0;letter-spacing:.42em}to{opacity:1;letter-spacing:.16em}}
@media (prefers-reduced-motion:reduce){.lg,.lg *,.lw,.lt{animation:none!important;opacity:1!important}}
.lf-t{transition:opacity 320ms cubic-bezier(0,0,0,1),transform 420ms cubic-bezier(.32,.72,0,1)}
.lf-zoom{transform-origin:75.8% 35%;transition:transform 640ms cubic-bezier(.7,0,.84,0),opacity 260ms ease 380ms}
.lf-press{transition:transform 100ms cubic-bezier(.2,0,0,1)}
.lf-press:active{transform:scale(.97)}
</style>

<style>body{margin:0}</style>

<style>
body{margin:0}
.ts-tab{transition:transform 120ms cubic-bezier(.2,0,0,1);-webkit-tap-highlight-color:transparent}
.ts-tab:active{transform:scale(.9)}
.ts-tab svg,.ts-tab span{transition:color 200ms ease,stroke 200ms ease,font-weight 200ms ease}
.ts-fab{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.ts-fab:active{transform:scale(.9)}
.ts-ind{transition:transform 420ms cubic-bezier(.32,.72,0,1)}
</style>
<style>html,body{margin:0;background:#E8EBEE}#app{display:inline-block;min-width:100%}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-LaunchFlow">
<div style="width:900px;height:952px;box-sizing:border-box;padding:32px;display:flex;gap:56px;background:#E8EBEE;font-family:Inter,system-ui,sans-serif">

<div style="display:flex;flex-direction:column;gap:16px;width:390px">
<div style="height:28px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#4B555E">{{t.name}} · tap through</div>
<div style="width:390px;height:844px;border-radius:40px;overflow:hidden;position:relative;background:{{t.bg}};box-shadow:0 0 0 1px {{t.frame}}">

<div style="position:absolute;inset:0;padding:24px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:20px;pointer-events:{{homePe}}">
<sc-for list="{{homeBlocks}}" as="hb" hint-placeholder-count="4">
<div class="lf-t" style="opacity:{{hb.op}};transform:{{hb.tf}};transition-delay:{{hb.delay}}">
<sc-if value="{{hb.isHead}}" hint-placeholder-val="{{ false }}">
<div style="display:flex;align-items:center;justify-content:space-between">
<div><div style="font-size:13px;font-weight:500;color:{{hb.t.tx3}}">Thursday · Mangaluru · 27°</div><div style="margin-top:2px;font-size:28px;line-height:34px;font-weight:650;letter-spacing:-.025em;color:{{hb.t.tx}}">Good morning</div></div>
<span style="width:44px;height:44px;border-radius:50%;background:{{hb.t.acs}};color:{{hb.t.ac}};font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center">A</span>
</div>
</sc-if>
<sc-if value="{{hb.isSearch}}" hint-placeholder-val="{{ false }}">
<div style="height:56px;border-radius:28px;border:1px solid {{hb.t.bd}};background:{{hb.t.sf}};display:flex;align-items:center;gap:12px;padding:0 8px 0 20px;box-sizing:border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{hb.t.tx}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-3.5-3.5"/></svg>
<span style="flex:1;font-size:16px;font-weight:500;color:{{hb.t.tx2}}">Where to?</span>
<span style="height:40px;padding:0 14px;border-radius:20px;background:{{hb.t.sf2}};display:flex;align-items:center;font-size:13px;font-weight:600;color:{{hb.t.tx}}">Work</span>
</div>
</sc-if>
<sc-if value="{{hb.isHero}}" hint-placeholder-val="{{ false }}">
<div style="border-radius:28px;background:{{hb.t.hero}};border:1px solid {{hb.t.heroBd}};padding:22px;display:flex;flex-direction:column;gap:18px">
<span style="font-size:13px;font-weight:600;color:{{hb.t.heroTx2}}">To work · Pumpwell Circle</span>
<div style="display:flex;align-items:flex-end;justify-content:space-between">
<div style="display:flex;align-items:baseline;gap:6px"><span style="font-size:56px;line-height:56px;font-weight:650;letter-spacing:-.04em;color:{{hb.t.heroTx}}">18</span><span style="font-size:20px;font-weight:600;color:{{hb.t.heroTx}}">min</span></div>
<div style="text-align:right"><div style="font-size:15px;font-weight:600;color:{{hb.t.heroTx}}">Arrive 10:32</div><div style="font-size:13px;color:{{hb.t.heroWarn}};margin-top:2px">+2 min than usual</div></div>
</div>
<div style="display:flex;align-items:center;gap:4px">
<span style="width:10px;height:10px;border-radius:50%;border:2.5px solid {{hb.t.heroAc}};box-sizing:border-box"></span>
<span style="flex:40;height:6px;border-radius:3px;background:{{hb.t.heroAc}}"></span><span style="flex:16;height:6px;border-radius:3px;background:{{hb.t.heroWarn}}"></span><span style="flex:44;height:6px;border-radius:3px;background:{{hb.t.heroAc}}"></span>
<span style="width:10px;height:10px;border-radius:50%;background:{{hb.t.heroTx}}"></span>
</div>
<div style="display:flex;gap:10px">
<span style="flex:1;height:52px;border-radius:16px;background:{{hb.t.heroAc}};color:{{hb.t.heroBtnTx}};font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center">Start</span>
<span style="flex:1;height:52px;border-radius:16px;border:1px solid {{hb.t.heroBd2}};color:{{hb.t.heroTx}};font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center">2 routes</span>
</div>
</div>
</sc-if>
<sc-if value="{{hb.isStats}}" hint-placeholder-val="{{ false }}">
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<sc-for list="{{hb.stats}}" as="s" hint-placeholder-count="3">
<span style="height:88px;border-radius:20px;border:1px solid {{s.t.bd}};background:{{s.t.sf}};padding:0 14px;display:flex;flex-direction:column;justify-content:center;gap:4px"><span style="font-size:24px;font-weight:650;letter-spacing:-.02em;color:{{s.fg}}">{{s.v}}</span><span style="font-size:12px;font-weight:500;color:{{s.t.tx2}}">{{s.label}}</span></span>
</sc-for>
</div>
</sc-if>
</div>
</sc-for>
</div>
<div class="lf-t" style="position:absolute;left:0;right:0;bottom:0;height:96px;opacity:{{navOp}};transform:{{navTf}};transition-delay:{{navDelay}}">
<dc-import name="NavBar" dark="{{t.dark}}" active="home" hint-size="390px,96px"></dc-import>
</div>

<div style="position:absolute;inset:0;background:{{t.bg}};padding:16px 20px 28px;box-sizing:border-box;display:flex;flex-direction:column;opacity:{{wBgOp}};pointer-events:{{wPe}}" class="lf-t">
<div class="lf-t" style="display:flex;align-items:center;justify-content:space-between;height:44px;opacity:{{wOp}};transition-delay:{{wD0}}">
<div style="display:flex;align-items:center;gap:10px"><img src="../assets/icon.png" alt="" style="width:32px;height:32px;border-radius:8px;display:block"><span style="font-size:16px;font-weight:650;color:{{t.tx}}">TrafficSense</span></div>
<span style="font-size:15px;font-weight:600;color:{{t.tx}}">Sign in</span>
</div>
<div class="lf-t" style="margin-top:12px;position:relative;height:420px;border-radius:32px;overflow:hidden;border:1px solid {{t.bd}};opacity:{{wOp}};transform:{{mapTf}};transition-delay:{{wD1}}">
<dc-import name="MapBase" dark="{{t.dark}}" scene="route" offset="{{ 96 }}" hint-size="100%,420px"></dc-import>
<span style="position:absolute;left:16px;right:16px;bottom:16px;height:64px;border-radius:20px;background:{{t.sf}};box-shadow:{{t.sh}};display:flex;align-items:center;padding:0 16px;font-size:15px;font-weight:600;color:{{t.tx}}">18 min to Bejai · avoids 1 report</span>
</div>
<div class="lf-t" style="opacity:{{wOp}};transform:{{wTf}};transition-delay:{{wD2}}">
<div style="margin-top:28px;font-size:34px;line-height:38px;font-weight:650;letter-spacing:-.035em;color:{{t.tx}}">Know the road<br>before you go.</div>
<p style="margin:10px 0 0;font-size:16px;line-height:23px;color:{{t.tx2}}">Live reports from Mangaluru commuters. Plan around floods, jams and closures.</p>
</div>
<div class="lf-t" style="margin-top:auto;display:flex;flex-direction:column;gap:6px;opacity:{{wOp}};transform:{{wTf}};transition-delay:{{wD3}}">
<button class="lf-press" onClick="{{go}}" style="height:56px;border-radius:18px;border:0;background:{{t.ac}};color:{{t.onac}};font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:10px">Plan my route
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.onac}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
<button onClick="{{go}}" style="height:48px;border:0;background:none;font-size:15px;font-weight:600;color:{{t.tx}}">Explore the live map</button>
</div>
</div>

<div class="lf-t" style="position:absolute;inset:0;background:{{t.bg}};display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:{{sOp}};transform:{{sTf}};transition-delay:{{sDelay}};pointer-events:none">
<sc-if value="{{splashOn}}" hint-placeholder-val="{{ true }}">
<div style="display:flex;flex-direction:column;align-items:center">
<div class="lg-wrap lf-zoom" style="transform:{{zTf}};opacity:{{zOp}}"><svg class="lg" width="136" height="136" viewBox="0 0 120 120" role="img" aria-label="TrafficSense" style="display:block;border-radius:32px;box-shadow:{{t.iconSh}}">
<defs>
<clipPath id="lgClip"><rect width="120" height="120" rx="28"/></clipPath>
<linearGradient id="lgSky" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#36AEF6"/><stop offset="1" stop-color="#0A63D6"/></linearGradient>
<linearGradient id="lgGrass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3FD46F"/><stop offset="1" stop-color="#0C9C86"/></linearGradient>
<linearGradient id="lgPin" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF6B3D"/><stop offset="1" stop-color="#E5173F"/></linearGradient>
</defs>
<g clip-path="url(#lgClip)">
<rect width="120" height="120" fill="url(#lgSky)"/>
<path class="lg-hr" d="M120 26C96 34 80 56 88 84C92 100 104 112 120 118Z" fill="#9AD8FB"/>
<path class="lg-hl" d="M0 30C24 38 38 62 28 90C24 104 26 114 30 124H0Z" fill="url(#lgGrass)"/>
<path class="lg-edge" d="M62 126C58 98 30 90 34 66C38 46 62 40 78 14" pathLength="100" stroke="#FFFFFF" stroke-width="27" fill="none"/>
<path class="lg-road" d="M62 126C58 98 30 90 34 66C38 46 62 40 78 14" pathLength="100" stroke="#141C2B" stroke-width="20" fill="none"/>
<path class="lg-lane" d="M62 126C58 98 30 90 34 66C38 46 62 40 78 14" pathLength="100" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" fill="none"/>
<g opacity="0">
<rect x="-4" y="-2.2" width="8" height="4.4" rx="2.2" fill="#FFF1B8"/>
<animateMotion dur="1.6s" begin="1.3s" repeatCount="indefinite" rotate="auto" path="M62 126C58 98 30 90 34 66C38 46 62 40 78 14"/>
<animate attributeName="opacity" values="0;1;1;0" keyTimes="0;.15;.75;1" dur="1.6s" begin="1.3s" repeatCount="indefinite"/>
</g>
<ellipse class="lg-rip" cx="91" cy="63" rx="7" ry="2.4" fill="none" stroke="#FFFFFF" stroke-width="1.6"/>
<ellipse class="lg-rip2" cx="91" cy="63" rx="7" ry="2.4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/>
<ellipse class="lg-sh" cx="91" cy="63" rx="6" ry="1.8" fill="#000000"/>
<g class="lg-pin">
<path d="M91 63C88 58 78 51 78 42A13 13 0 1 1 104 42C104 51 94 58 91 63Z" fill="url(#lgPin)" stroke="#FFFFFF" stroke-width="2"/>
<circle cx="91" cy="42" r="5.2" fill="#FFFFFF"/>
</g>
</g>
</svg></div>
<div style="display:flex;flex-direction:column;align-items:center;opacity:{{wmOp}};transition:opacity 160ms ease">
<div style="margin-top:32px;font-size:30px;font-weight:650;letter-spacing:-.025em;color:{{t.tx}}"><sc-for list="{{letters}}" as="l" hint-placeholder-count="12"><span class="lw" style="animation-delay:{{l.d}};color:{{l.c}}">{{l.ch}}</span></sc-for></div>
<div class="lt" style="margin-top:8px;font-size:12px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:{{t.tx3}}">Safer roads · Smarter commutes</div>
</div>
</div>
</sc-if>
</div>
</div>
</div>

<div style="flex:1;display:flex;flex-direction:column;gap:24px;padding-top:44px">
<div>
<div style="font-size:13px;font-weight:600;color:#0B6B5F;letter-spacing:.04em;text-transform:uppercase">Prototype</div>
<h2 style="margin:6px 0 0;font-size:32px;line-height:38px;font-weight:650;letter-spacing:-.025em;color:#121619">Launch flow</h2>
</div>
<div style="display:flex;flex-direction:column;gap:6px">
<sc-for list="{{steps}}" as="s" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:14px;height:56px;padding:0 16px;border-radius:16px;background:{{s.bg}};box-shadow:{{s.ring}}">
<span style="width:28px;height:28px;border-radius:14px;background:{{s.dot}};color:{{s.dotTx}};font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center">{{s.n}}</span>
<span style="flex:1;display:flex;flex-direction:column"><span style="font-size:15px;font-weight:600;color:#121619">{{s.name}}</span><span style="font-size:13px;color:#4B555E">{{s.note}}</span></span>
</div>
</sc-for>
</div>
<div style="display:flex;gap:10px">
<button class="lf-press" onClick="{{replay}}" style="height:44px;padding:0 18px;border-radius:14px;border:0;background:#0B6B5F;color:#FFFFFF;font-size:14px;font-weight:600">Replay</button>
<button class="lf-press" onClick="{{toggleDark}}" style="height:44px;padding:0 18px;border-radius:14px;border:1px solid #D5DADE;background:#FFFFFF;color:#121619;font-size:14px;font-weight:600">{{themeLabel}}</button>
</div>
<div style="border-radius:20px;background:#FFFFFF;box-shadow:0 0 0 1px #E2E5E8;padding:6px 18px">
<sc-for list="{{rules}}" as="r" hint-placeholder-count="4">
<div style="padding:12px 0;border-top:{{r.sep}};display:flex;flex-direction:column;gap:3px">
<span style="font-size:14px;font-weight:600;color:#121619">{{r.k}}</span>
<span style="font-size:13px;line-height:18px;color:#4B555E">{{r.v}}</span>
</div>
</sc-for>
</div>
</div>

</div>
</template>
<template id="tpl-MapBase">
<div style="width:100%;height:100%;overflow:hidden;background:{{c.land}};font-family:Inter,system-ui,sans-serif">
<svg width="100%" height="100%" viewBox="0 {{vy}} 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of central Mangaluru">
<rect y="-300" width="390" height="1444" fill="{{c.land}}"/>
<ellipse cx="300" cy="250" rx="42" ry="28" fill="{{c.park}}"/>
<ellipse cx="128" cy="575" rx="32" ry="20" fill="{{c.park}}"/>
<ellipse cx="345" cy="520" rx="26" ry="36" fill="{{c.park}}"/>
<path d="M0 -300H80C66 -100 60 0 72 0C60 120 84 220 66 330C52 430 80 520 60 640C48 720 72 790 58 844C50 950 66 1050 60 1144H0Z" fill="{{c.water}}"/>
<path d="M66 170C140 150 200 190 260 160S360 120 390 140" stroke="{{c.water}}" stroke-width="16" fill="none"/>
<path d="M60 700C140 676 200 728 280 706S360 656 390 676" stroke="{{c.water}}" stroke-width="34" fill="none"/>
<g stroke="{{c.road}}" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M90 262H360M100 384H380M110 522H370M84 610H360M150 110V660M210 130V680M330 200V640M90 444C180 432 260 472 380 452M96 330C160 340 220 320 300 336M120 40H380M100 800H380"/>
</g>
<g fill="none" stroke-linecap="round">
<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.major}}" stroke-width="6"/>
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" stroke="{{c.major}}" stroke-width="6"/>
</g>
<g opacity="{{trafficOp}}" fill="none" stroke-linecap="round">
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" pathLength="100" stroke="{{c.warn}}" stroke-width="5" stroke-dasharray="0 22 20 100"/>
<path d="M250 0C240 140 300 260 290 400S330 600 300 844" pathLength="100" stroke="{{c.danger}}" stroke-width="5" stroke-dasharray="0 38 10 100"/>
<path d="M250 0C240 140 300 260 290 400S330 600 300 844" pathLength="100" stroke="{{c.warn}}" stroke-width="5" stroke-dasharray="0 48 12 100"/>
</g>
<g font-size="11" font-weight="500" fill="{{c.label}}" letter-spacing=".01em">
<text x="168" y="232">Urwa</text>
<text x="98" y="300">Ladyhill</text>

</button>

<script src="../runtime/ts-runtime.js"></script>
<script>
TS.define('LaunchFlow', function (DCLogic) {
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { stage: 'splash', dark: false }; }
  componentDidMount() { this.timers = []; this.schedule(); }
  componentWillUnmount() { (this.timers || []).forEach(clearTimeout); }
  schedule() { this.timers.push(setTimeout(() => { if (this.state.stage === 'splash') this.setState({ stage: 'welcome' }); }, 3900)); }
  renderVals() {
    const L = {dark:false,name:'Light',brand:'#1683E8',bg:'#F5F6F7',sf:'#FFFFFF',sf2:'#EEF0F2',bd:'#E2E5E8',tx:'#121619',tx2:'#4B555E',tx3:'#68737D',ac:'#0B6B5F',acs:'#E2F0ED',onac:'#FFFFFF',wn:'#9A5700',frame:'#D9DDE1',track:'#E2E5E8',sh:'0 1px 2px rgba(16,24,32,.06), 0 8px 24px rgba(16,24,32,.12)',iconSh:'0 1px 2px rgba(16,24,32,.08), 0 12px 32px rgba(16,24,32,.14)',
      hero:'#0E1A19',heroBd:'#0E1A19',heroBd2:'rgba(255,255,255,.18)',heroTx:'#FFFFFF',heroTx2:'#B9C6C3',heroAc:'#5CCFBB',heroWarn:'#F2B163',heroBtnTx:'#04221D'};
    const D = {dark:true,name:'Dark',brand:'#4BA6FF',bg:'#0B0F10',sf:'#13181A',sf2:'#1B2124',bd:'#252D30',tx:'#EEF2F3',tx2:'#A9B4B8',tx3:'#8A969B',ac:'#56C7B3',acs:'#0F2C28',onac:'#03211C',wn:'#F2AA55',frame:'#252D30',track:'#1B2124',sh:'0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.5)',iconSh:'0 12px 32px rgba(0,0,0,.6)',
      hero:'#13201E',heroBd:'#1F3330',heroBd2:'rgba(255,255,255,.14)',heroTx:'#EEF2F3',heroTx2:'#A9B9B5',heroAc:'#56C7B3',heroWarn:'#F2AA55',heroBtnTx:'#03211C'};
    const t = this.state.dark ? D : L;
    const st = this.state.stage;
    const isW = st === 'welcome', isL = st === 'leaving', isH = st === 'home';
    const wEnter = (ms) => isW ? ms + 'ms' : '0ms';
    const homeIn = isH;
    const blocks = ['isHead','isSearch','isHero','isStats'].map((k, i) => ({
      isHead: k === 'isHead', isSearch: k === 'isSearch', isHero: k === 'isHero', isStats: k === 'isStats',
      t, op: homeIn ? 1 : 0, tf: homeIn ? 'none' : 'translateY(12px)', delay: homeIn ? (i * 40) + 'ms' : '0ms',
      stats: [{v:'3',label:'Reports nearby',fg:t.tx,t},{v:'1',label:'On your route',fg:t.wn,t},{v:'14:20',label:'High tide, Ullal',fg:t.tx,t}]
    }));
    const order = ['splash','welcome','home'];
    const cur = isL ? 'home' : (st === 'boot' ? 'splash' : st);
    const steps = [
      {n:1,id:'splash',name:'Loading',note:'Logo plays · about 4 s'},
      {n:2,id:'welcome',name:'Welcome',note:'Tap “Plan my route”'},
      {n:3,id:'home',name:'Home',note:'Cards rise in, nav bar last'}
    ].map(s => ({...s, bg: s.id === cur ? '#FFFFFF' : 'transparent', ring: s.id === cur ? '0 0 0 1px #E2E5E8' : 'none', dot: s.id === cur ? '#0B6B5F' : '#DDE1E4', dotTx: s.id === cur ? '#FFFFFF' : '#4B555E'}));
    const rules = [
      {k:'Loading',v:'Tile pops in, road draws, pin falls and bounces. While loading, the pin hops and spins and a car drives the road.'},
      {k:'Loading → Welcome',v:'Camera zooms through the pin (9×, 640 ms) while Welcome rises in, 60 ms apart.'},
      {k:'Welcome → Home',v:'Text drops 16 px and fades, map card grows to 1.06 and fades. Home cards rise 12 px, 40 ms apart.'},
      {k:'Press',v:'Buttons scale to 0.97 for 100 ms.'},
      {k:'When to show',v:'Welcome only on first launch. After that, loading goes straight to Home.'}
    ].map((r,i) => ({...r, sep: i ? '1px solid #EEF0F2' : '0'}));
    return {
      t,
      letters: 'TrafficSense'.split('').map((ch, i) => ({ ch, d: (1250 + i * 30) + 'ms', c: i > 6 ? t.brand : t.tx })),
      splashOn: st !== 'boot',
      sOp: (st === 'splash' || st === 'boot') ? 1 : 0,
      sTf: 'none',
      sDelay: (st === 'splash' || st === 'boot') ? '0ms' : '420ms',
      zTf: (st === 'splash' || st === 'boot') ? 'none' : 'scale(9)',
      zOp: (st === 'splash' || st === 'boot') ? 1 : 0,
      wmOp: (st === 'splash' || st === 'boot') ? 1 : 0,
      wBgOp: (isW || st === 'splash' || st === 'boot') ? 1 : 0,
      wPe: isW ? 'auto' : 'none',
      wOp: isW ? 1 : 0,
      wTf: isW ? 'none' : (isL || isH ? 'translateY(16px)' : 'translateY(24px)'),
      mapTf: isW ? 'none' : (isL || isH ? 'scale(1.06)' : 'scale(.96)'),
      wD0: wEnter(0), wD1: wEnter(60), wD2: wEnter(120), wD3: wEnter(180),
      homePe: isH ? 'auto' : 'none',
      homeBlocks: blocks,
      navOp: isH ? 1 : 0, navTf: isH ? 'none' : 'translateY(24px)', navDelay: isH ? '200ms' : '0ms',
      steps, rules,
      themeLabel: this.state.dark ? 'Light theme' : 'Dark theme',
      go: () => {
        if (this.state.stage !== 'welcome') return;
        this.setState({ stage: 'leaving' });
        this.timers.push(setTimeout(() => this.setState({ stage: 'home' }), 280));
      },
      replay: () => {
        (this.timers || []).forEach(clearTimeout); this.timers = [];
        this.setState({ stage: 'boot' });
        this.timers.push(setTimeout(() => { this.setState({ stage: 'splash' }); this.schedule(); }, 40));
      },
      toggleDark: () => this.setState({ dark: !this.state.dark })
    };
  }
}
return Component;
}, 'tpl-LaunchFlow');
TS.define('MapBase', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const scene = this.props.scene ?? 'traffic';
    const c = dark
      ? { land:'#121618', park:'#142019', water:'#0C1B22', road:'#1F2528', casing:'#121618', major:'#343C41', label:'#7C878E', route:'#56C7B3', onRoute:'#03211C', casingRoute:'#0B0F10', alt:'#4E595F', warn:'#F2AA55', danger:'#F7897D', neutral:'#A9B4B8', ink:'#EEF2F3', bubble:'#1B2124', bubbleBd:'#2E373B' }
      : { land:'#F2F3F0', park:'#E1EADB', water:'#CFE0E9', road:'#FFFFFF', casing:'#DDE0DA', major:'#FFFFFF', label:'#6B757E', route:'#0B6B5F', onRoute:'#FFFFFF', casingRoute:'#FFFFFF', alt:'#A3ACB3', warn:'#D27A12', danger:'#CC3B2E', neutral:'#4B555E', ink:'#121619', bubble:'#FFFFFF', bubbleBd:'#D5D9DD' };
    return {
      c,
      vy: this.props.offset ?? 0,
      routeOp: scene === 'route' || scene === 'preview' ? 1 : 0,
      bubbleOp: scene === 'route' ? 1 : 0,
      pinOp: scene === 'traffic' ? 1 : 0,
      trafficOp: scene === 'traffic' || scene === 'route' ? 1 : 0,
      youOp: scene === 'traffic' ? 1 : 0
    };
  }
}
return Component;
}, 'tpl-MapBase');
TS.define('NavBar', function (DCLogic) {
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cur: null }; }
  renderVals() {
    const dark = !!this.props.dark;
    const c = dark
      ? { glass:'rgba(27,33,36,.86)', edge:'rgba(255,255,255,.07)', sh:'0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.55)', ind:'#173B35', tx:'#EEF2F3', tx3:'#8A969B', ac:'#56C7B3', onac:'#03211C', fabSh:'0 10px 24px rgba(0,0,0,.5)' }
      : { glass:'rgba(255,255,255,.9)', edge:'rgba(16,24,32,.06)', sh:'0 1px 2px rgba(16,24,32,.06), 0 10px 30px rgba(16,24,32,.12)', ind:'#E2F0ED', tx:'#0B6B5F', tx3:'#5F6A73', ac:'#0B6B5F', onac:'#FFFFFF', fabSh:'0 1px 2px rgba(16,24,32,.12), 0 10px 24px rgba(16,24,32,.18)' };
    const auth = (this.props.role ?? 'commuter') === 'authority';
    const cur = this.state.cur ?? this.props.active ?? 'home';
    const D = {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      map: 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
      plan: 'M4 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0M16 5a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16',
      me: auth ? 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6zM9 12l2 2 4-4' : 'M8 8a4 4 0 1 0 8 0a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0'
    };
    const ids = ['home', 'map', 'plan', 'me'];
    const labels = { home: 'Home', map: 'Map', plan: 'Plan', me: auth ? 'Ops' : 'Me' };
    const idx = Math.max(0, ids.indexOf(cur));
    const items = ids.map(id => ({
      id, label: labels[id], d: D[id],
      fg: id === cur ? c.tx : c.tx3,
      fw: id === cur ? 600 : 500,
      sw: id === cur ? 2.1 : 1.8,
      current: id === cur ? 'page' : 'false',
      pick: () => this.setState({ cur: id })
    }));
    return { c, items, indX: 'translateX(' + (idx * 68) + 'px)' };
  }
}
return Component;
}, 'tpl-NavBar');
TS.mount('LaunchFlow', document.getElementById('app'));
</script>

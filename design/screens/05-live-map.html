<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficSense · Live map</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0} button,input{font-family:inherit} button{cursor:pointer}</style>

<style>body{margin:0}</style>

<style>
body{margin:0}
.ts-tab{transition:transform 120ms cubic-bezier(.2,0,0,1);-webkit-tap-highlight-color:transparent}
.ts-tab:active{transform:scale(.9)}
.ts-tab svg,.ts-tab span{transition:color 200ms ease,stroke 200ms ease,font-weight 200ms ease}
.ts-fab{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.ts-fab:active{transform:scale(.9)}
.ts-ind{transition:transform 420ms cubic-bezier(.32,.72,0,1)}
</style>
<style>html,body{margin:0;background:#E8EBEE}#app{display:inline-block;min-width:100%}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-LiveMap">
<div style="width:900px;height:952px;box-sizing:border-box;padding:32px;display:flex;gap:56px;background:#E8EBEE;font-family:Inter,system-ui,sans-serif">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px;width:390px">
<div style="height:28px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#4B555E">{{t.name}}</div>
<div style="width:390px;height:844px;border-radius:40px;overflow:hidden;position:relative;background:{{t.bg}};box-shadow:0 0 0 1px {{t.frame}}">
<div style="position:absolute;inset:0">
<dc-import name="MapBase" dark="{{t.dark}}" scene="traffic" offset="{{ 90 }}" hint-size="100%,100%"></dc-import>
</div>

<div style="position:absolute;top:16px;left:16px;right:16px;height:52px;border-radius:26px;background:{{t.sf}};box-shadow:{{t.sh}};border:1px solid {{t.edge}};display:flex;align-items:center;gap:10px;padding:0 6px 0 18px;box-sizing:border-box">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.tx2}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-3.5-3.5"/></svg>
<label style="flex:1;min-width:0"><span style="position:absolute;width:1px;height:1px;overflow:hidden">Search</span><input placeholder="Search roads or areas" style="width:100%;border:0;outline:0;background:transparent;font-size:15px;color:{{t.tx}}"/></label>
<button aria-label="Account" style="width:40px;height:40px;border-radius:50%;border:0;background:{{t.acs}};color:{{t.ac}};font-size:14px;font-weight:600">A</button>
</div>

<div style="position:absolute;top:78px;left:16px;right:0;display:flex;gap:8px;overflow:hidden;padding:2px 0 8px">
<sc-for list="{{t.chips}}" as="ch" hint-placeholder-count="5">
<button aria-pressed="{{ch.pressed}}" style="flex-shrink:0;height:36px;padding:0 14px;border-radius:18px;border:1px solid {{ch.bd}};background:{{ch.bg}};color:{{ch.fg}};font-size:13px;font-weight:600;white-space:nowrap;box-shadow:{{ch.t.shSm}}">{{ch.label}}</button>
</sc-for>
</div>

<div style="position:absolute;top:126px;left:16px;height:30px;padding:0 4px 0 10px;border-radius:15px;background:{{t.sf}};box-shadow:{{t.shSm}};border:1px solid {{t.edge}};display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:{{t.tx2}}">
<span style="width:6px;height:6px;border-radius:50%;background:{{t.ac}}"></span>Updated 09:42
<span style="height:22px;padding:0 8px;border-radius:11px;border:1px dashed {{t.tx3}};display:flex;align-items:center;font-size:11px">Simulated</span>
</div>

<div style="position:absolute;right:16px;bottom:396px;display:flex;flex-direction:column;border-radius:22px;background:{{t.sf}};box-shadow:{{t.sh}};border:1px solid {{t.edge}};overflow:hidden">
<button aria-label="Map layers" style="width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m12 3 9 5-9 5-9-5 9-5zM3 13l9 5 9-5"/></svg>
</button>
<span style="height:1px;background:{{t.bd}};margin:0 10px"></span>
<button aria-label="Show my location" style="width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="{{t.ac}}" stroke="{{t.ac}}" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8z"/></svg>
</button>
</div>
<span style="position:absolute;left:16px;bottom:392px;font-size:10px;color:{{t.tx3}}">© OpenStreetMap</span>

<div style="position:absolute;left:0;right:0;bottom:0;background:{{t.sheet}};border-radius:28px 28px 0 0;box-shadow:{{t.sheetSh}};padding:8px 0 104px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
<div style="width:36px;height:5px;border-radius:3px;background:{{t.handle}};align-self:center"></div>
<div style="display:flex;align-items:center;justify-content:space-between;padding:0 20px">
<div style="display:flex;align-items:baseline;gap:8px"><h2 style="margin:0;font-size:20px;font-weight:650;color:{{t.tx}};letter-spacing:-.015em">Nearby</h2><span style="font-size:14px;color:{{t.tx3}}">3 reports</span></div>
<div role="tablist" style="height:36px;padding:3px;box-sizing:border-box;border-radius:18px;background:{{t.sf2}};display:flex;gap:2px">
<button role="tab" aria-selected="true" style="height:30px;padding:0 12px;border-radius:15px;border:0;background:{{t.seg}};color:{{t.tx}};font-size:13px;font-weight:600;box-shadow:{{t.shSm}}">Map</button>
<button role="tab" aria-selected="false" style="height:30px;padding:0 12px;border-radius:15px;border:0;background:transparent;color:{{t.tx2}};font-size:13px;font-weight:600">List</button>
</div>
</div>

<div style="display:flex;gap:10px;padding:0 20px;overflow:hidden">
<div style="flex-shrink:0;width:300px;box-sizing:border-box;border-radius:22px;background:{{t.sf}};border:1px solid {{t.bd}};padding:16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:12px">
<span style="width:42px;height:42px;border-radius:14px;background:{{t.wns}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.wn}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:16px;font-weight:600;color:{{t.tx}}">Jyothi Circle</span>
<span style="font-size:13px;color:{{t.tx3}}">Flooding · 4 min · 350 m</span>
</span>
<span style="height:26px;padding:0 9px;border-radius:13px;background:{{t.sf2}};display:flex;align-items:center;gap:6px">
<span style="display:flex;align-items:flex-end;gap:2px;height:12px">
<sc-for list="{{t.bars}}" as="b" hint-placeholder-count="6"><span style="width:3px;height:{{b.h}}px;border-radius:1px;background:{{b.c}}"></span></sc-for>
</span>
<span style="font-size:12px;font-weight:600;color:{{t.tx2}}">L3</span>
</span>
</div>
<p style="margin:0;font-size:14px;line-height:20px;color:{{t.tx2}}">Curbside lanes flooded. Two-wheelers using the flyover.</p>
<div style="display:flex;gap:8px">
<button style="flex:1;height:44px;border-radius:14px;border:0;background:{{t.sf2}};color:{{t.tx}};font-size:14px;font-weight:600">Still there · 7</button>
<button style="height:44px;padding:0 14px;border-radius:14px;border:1px solid {{t.bd}};background:transparent;color:{{t.tx}};font-size:14px;font-weight:600">Cleared</button>
<button aria-label="Avoid this area" style="width:44px;height:44px;border-radius:14px;border:0;background:{{t.ac}};display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.onac}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0M16 5a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16"/></svg>
</button>
</div>
</div>
<div style="flex-shrink:0;width:300px;box-sizing:border-box;border-radius:22px;background:{{t.sf}};border:1px solid {{t.bd}};padding:16px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;gap:12px">
<span style="width:42px;height:42px;border-radius:14px;background:{{t.dgs}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.dg}}" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7 12h10"/></svg>
</span>
<span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:16px;font-weight:600;color:{{t.tx}}">Kadri bypass</span><span style="font-size:13px;color:{{t.tx3}}">Closed · 12 min</span></span>
</div>
</div>
</div>

<div style="display:flex;justify-content:center;gap:6px">
<span style="width:18px;height:6px;border-radius:3px;background:{{t.tx}}"></span>
<span style="width:6px;height:6px;border-radius:3px;background:{{t.handle}}"></span>
<span style="width:6px;height:6px;border-radius:3px;background:{{t.handle}}"></span>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:96px">
<dc-import name="NavBar" dark="{{t.dark}}" active="map" hint-size="390px,96px"></dc-import>
</div>
</div>
</div>
</sc-for>
</div>
</template>
<template id="tpl-MapBase">
<div style="width:100%;height:100%;overflow:hidden;background:{{c.land}};font-family:Inter,system-ui,sans-serif">
<svg width="100%" height="100%" viewBox="0 {{vy}} 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of central Mangaluru">
<rect y="-300" width="390" height="1444" fill="{{c.land}}"/>
<ellipse cx="300" cy="250" rx="42" ry="28" fill="{{c.park}}"/>
<ellipse cx="128" cy="575" rx="32" ry="20" fill="{{c.park}}"/>
<ellipse cx="345" cy="520" rx="26" ry="36" fill="{{c.park}}"/>
<path d="M0 -300H80C66 -100 60 0 72 0C60 120 84 220 66 330C52 430 80 520 60 640C48 720 72 790 58 844C50 950 66 1050 60 1144H0Z" fill="{{c.water}}"/>

</g>

<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.major}}" stroke-width="6"/>

<text x="168" y="232">Urwa</text>

<text x="118" y="752">Bolar</text>
<text x="146" y="418" font-size="14" font-weight="600">Mangaluru</text>
</g>

<path d="M140 478C140 420 180 360 230 330S270 300 282 300" stroke="{{c.casingRoute}}" stroke-width="9"/>

<g opacity="{{pinOp}}">

</g>

</svg>
</div>
</template>
<template id="tpl-NavBar">
<div style="position:relative;width:390px;height:96px;font-family:Inter,system-ui,sans-serif">
<nav aria-label="Main" style="position:absolute;left:16px;bottom:16px;width:284px;height:64px;box-sizing:border-box;padding:5px;border-radius:32px;background:{{c.glass}};-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid {{c.edge}};box-shadow:{{c.sh}};display:flex">
<span class="ts-ind" aria-hidden="true" style="position:absolute;top:5px;left:5px;width:68px;height:52px;border-radius:26px;background:{{c.ind}};transform:{{indX}}"></span>
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<button class="ts-tab" aria-current="{{it.current}}" onClick="{{it.pick}}" style="position:relative;width:68px;height:52px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:inherit">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="{{it.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke:{{it.fg}}"><path d="{{it.d}}"/></svg>
<span style="font-size:11px;line-height:13px;font-weight:{{it.fw}};color:{{it.fg}};letter-spacing:.01em">{{it.label}}</span>
</button>
</sc-for>
</nav>
<button class="ts-fab" aria-label="Report a hazard" style="position:absolute;right:16px;bottom:16px;width:64px;height:64px;border-radius:32px;border:0;background:{{c.ac}};box-shadow:{{c.fabSh}};display:flex;align-items:center;justify-content:center;cursor:pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.onac}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>
</template>
<script src="../runtime/ts-runtime.js"></script>
<script>
TS.define('LiveMap', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const T = {
      light:{dark:false,name:'Light',bg:'#F5F6F7',sf:'#FFFFFF',sf2:'#EEF0F2',bd:'#E2E5E8',tx:'#121619',tx2:'#4B555E',tx3:'#68737D',ac:'#0B6B5F',acs:'#E2F0ED',onac:'#FFFFFF',wn:'#9A5700',wns:'#FCF0DF',dg:'#B42318',dgs:'#FCEBE9',frame:'#D9DDE1',edge:'rgba(16,24,32,.05)',sheet:'#F7F8F9',seg:'#FFFFFF',handle:'#D3D8DC',sh:'0 1px 2px rgba(16,24,32,.06), 0 8px 24px rgba(16,24,32,.10)',shSm:'0 1px 2px rgba(16,24,32,.08)',sheetSh:'0 -1px 0 rgba(16,24,32,.04), 0 -12px 32px rgba(16,24,32,.10)'},
      dark:{dark:true,name:'Dark',bg:'#0B0F10',sf:'#13181A',sf2:'#1B2124',bd:'#252D30',tx:'#EEF2F3',tx2:'#A9B4B8',tx3:'#8A969B',ac:'#56C7B3',acs:'#0F2C28',onac:'#03211C',wn:'#F2AA55',wns:'#2A2013',dg:'#F7897D',dgs:'#331A19',frame:'#252D30',edge:'rgba(255,255,255,.07)',sheet:'#0F1415',seg:'#2A3236',handle:'#3A4448',sh:'0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.5)',shSm:'0 1px 2px rgba(0,0,0,.4)',sheetSh:'0 -1px 0 rgba(255,255,255,.06), 0 -12px 32px rgba(0,0,0,.5)'}
    };
    const chips = ['All · 3', 'Flooding', 'Traffic', 'Closures', 'Road works'];
    const themes = [T.light, T.dark].map(t => ({
      ...t,
      bars: [4,6,8,10,12,14].map((h,k) => ({h, c: k < 3 ? t.ac : t.bd})),
      chips: chips.map((label,k) => ({
        label, t,
        pressed: k === 0 ? 'true' : 'false',
        bg: k === 0 ? t.tx : t.sf,
        fg: k === 0 ? t.bg : t.tx,
        bd: k === 0 ? t.tx : t.edge
      }))
    }));
    return { themes };
  }
}
return Component;
}, 'tpl-LiveMap');
TS.define('MapBase', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const scene = this.props.scene ?? 'traffic';
    const c = dark
      ? { land:'#121618', park:'#142019', water:'#0C1B22', road:'#1F2528', casing:'#121618', major:'#343C41', label:'#7C878E', route:'#56C7B3', onRoute:'#03211C', casingRoute:'#0B0F10', alt:'#4E595F', warn:'#F2AA55', danger:'#F7897D', neutral:'#A9B4B8', ink:'#EEF2F3', bubble:'#1B2124', bubbleBd:'#2E373B' }
      : { land:'#F2F3F0', park:'#E1EADB', water:'#CFE0E9', road:'#FFFFFF', casing:'#DDE0DA', major:'#FFFFFF', label:'#6B757E', route:'#0B6B5F', onRoute:'#FFFFFF', casingRoute:'#FFFFFF', alt:'#A3ACB3', warn:'#D27A12', danger:'#CC3B2E', neutral:'#4B555E', ink:'#121619', bubble:'#FFFFFF', bubbleBd:'#D5D9DD' };
    return {
      c,
      vy: this.props.offset ?? 0,
      routeOp: scene === 'route' || scene === 'preview' ? 1 : 0,
      bubbleOp: scene === 'route' ? 1 : 0,
      pinOp: scene === 'traffic' ? 1 : 0,
      trafficOp: scene === 'traffic' || scene === 'route' ? 1 : 0,
      youOp: scene === 'traffic' ? 1 : 0
    };
  }
}
return Component;
}, 'tpl-MapBase');
TS.define('NavBar', function (DCLogic) {
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cur: null }; }
  renderVals() {

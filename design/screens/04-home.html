<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficSense · Home</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0} button{font-family:inherit;cursor:pointer} a{color:inherit;text-decoration:none}</style>

<style>body{margin:0}</style>

<style>
body{margin:0}
.ts-tab{transition:transform 120ms cubic-bezier(.2,0,0,1);-webkit-tap-highlight-color:transparent}
.ts-tab:active{transform:scale(.9)}
.ts-tab svg,.ts-tab span{transition:color 200ms ease,stroke 200ms ease,font-weight 200ms ease}
.ts-fab{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.ts-fab:active{transform:scale(.9)}
.ts-ind{transition:transform 420ms cubic-bezier(.32,.72,0,1)}
</style>
<style>html,body{margin:0;background:#E8EBEE}#app{display:inline-block;min-width:100%}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-Main">
<div style="width:900px;height:1488px;box-sizing:border-box;padding:32px;display:flex;gap:56px;background:#E8EBEE;font-family:Inter,system-ui,sans-serif">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px;width:390px">
<div style="height:28px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#4B555E">{{t.name}}</div>
<div style="width:390px;height:1380px;border-radius:40px;overflow:hidden;position:relative;background:{{t.bg}};box-shadow:0 0 0 1px {{t.frame}}">
<div style="position:absolute;inset:0;padding:24px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:20px">

<div style="position:relative;z-index:10;display:flex;align-items:center;justify-content:space-between">
<div>
<div style="font-size:13px;font-weight:500;color:{{t.tx3}}">Thursday · Mangaluru · 27°</div>
<h1 style="margin:2px 0 0;font-size:28px;line-height:34px;font-weight:650;letter-spacing:-.025em;color:{{t.tx}}">Good morning</h1>
</div>
<div style="position:relative;display:flex;gap:8px">
<button aria-label="More options" aria-expanded="{{t.expanded}}" onClick="{{t.toggle}}" style="width:44px;height:44px;border-radius:50%;border:0;background:{{t.moreBg}};display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="{{t.tx}}" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg>
</button>
<button aria-label="Account" style="width:44px;height:44px;border-radius:50%;border:0;background:{{t.acs}};color:{{t.ac}};font-size:16px;font-weight:600">A</button>
<sc-if value="{{t.open}}" hint-placeholder-val="{{ false }}">
<div role="menu" style="position:absolute;top:52px;right:0;width:240px;z-index:10;border-radius:20px;background:{{t.sf}};border:1px solid {{t.bd}};box-shadow:{{t.menuSh}};padding:6px">
<sc-for list="{{t.menu}}" as="m" hint-placeholder-count="5">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><div style="height:1px;background:{{m.t.bd}};margin:6px 10px"></div></sc-if>
<a role="menuitem" href="{{m.href}}" style="height:44px;border-radius:12px;display:flex;align-items:center;gap:12px;padding:0 12px;font-size:15px;font-weight:500;color:{{m.t.tx}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{m.t.tx2}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"/></svg>{{m.label}}</a>
</sc-for>
</div>
</sc-if>
</div>
</div>

<button style="height:56px;border-radius:28px;border:1px solid {{t.bd}};background:{{t.sf}};display:flex;align-items:center;gap:12px;padding:0 8px 0 20px;text-align:left">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M4 11a7 7 0 1 0 14 0a7 7 0 1 0-14 0M20 20l-3.5-3.5"/></svg>
<span style="flex:1;font-size:16px;font-weight:500;color:{{t.tx2}}">Where to?</span>
<span style="height:40px;padding:0 14px;border-radius:20px;background:{{t.sf2}};display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:{{t.tx}}">
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h16v12H4zM9 8V5h6v3"/></svg>Work</span>
</button>

<div style="border-radius:28px;background:{{t.hero}};border:1px solid {{t.heroBd}};padding:22px 22px 20px;display:flex;flex-direction:column;gap:18px">
<div style="display:flex;align-items:center;justify-content:space-between">
<span style="font-size:13px;font-weight:600;color:{{t.heroTx2}}">To work · Pumpwell Circle</span>
<span style="font-size:13px;color:{{t.heroTx3}}">via Kadri bypass</span>
</div>
<div style="display:flex;align-items:flex-end;justify-content:space-between">
<div style="display:flex;align-items:baseline;gap:6px">
<span style="font-size:56px;line-height:56px;font-weight:650;letter-spacing:-.04em;color:{{t.heroTx}};font-variant-numeric:tabular-nums">18</span>
<span style="font-size:20px;font-weight:600;color:{{t.heroTx}}">min</span>
</div>
<div style="text-align:right">
<div style="font-size:15px;font-weight:600;color:{{t.heroTx}}">Arrive 10:32</div>
<div style="font-size:13px;color:{{t.heroWarn}};margin-top:2px">+2 min than usual</div>
</div>
</div>
<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;align-items:center;gap:4px">
<span style="width:10px;height:10px;border-radius:50%;border:2.5px solid {{t.heroAc}};box-sizing:border-box;flex-shrink:0"></span>
<span style="flex:40;height:6px;border-radius:3px;background:{{t.heroAc}}"></span>
<span style="flex:16;height:6px;border-radius:3px;background:{{t.heroWarn}}"></span>
<span style="flex:44;height:6px;border-radius:3px;background:{{t.heroAc}}"></span>
<span style="width:10px;height:10px;border-radius:50%;background:{{t.heroTx}};flex-shrink:0"></span>
</div>
<div style="display:flex;justify-content:space-between;font-size:12px;color:{{t.heroTx3}}"><span>Ladyhill</span><span style="color:{{t.heroWarn}};font-weight:600">Flooding · Jyothi</span><span>Pumpwell</span></div>
</div>
<div style="display:flex;gap:10px">
<button style="flex:1;height:52px;border-radius:16px;border:0;background:{{t.heroBtn}};color:{{t.heroBtnTx}};font-size:16px;font-weight:600">Start journey</button>
<a href="06-plan-route.html" style="flex:1;height:52px;border-radius:16px;border:1px solid {{t.heroBd2}};color:{{t.heroTx}};font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center">2 routes</a>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px">
<sc-for list="{{t.stats}}" as="s" hint-placeholder-count="3">
<button style="position:relative;height:88px;border-radius:20px;border:1px solid {{s.bd}};background:{{s.bg}};padding:0 14px;display:flex;flex-direction:column;justify-content:center;align-items:flex-start;gap:4px;text-align:left">
<span style="font-size:24px;line-height:28px;font-weight:650;letter-spacing:-.02em;color:{{s.fg}};font-variant-numeric:tabular-nums">{{s.v}}</span>
<span style="font-size:12px;line-height:15px;font-weight:500;color:{{s.t.tx2}}">{{s.label}}</span>
</button>
</sc-for>
</div>

<div style="border-radius:24px;background:{{t.sf}};border:1px solid {{t.bd}};padding:18px;display:flex;flex-direction:column;gap:14px">
<div style="display:flex;gap:12px;align-items:center">
<span style="width:44px;height:44px;border-radius:14px;background:{{t.wns}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.wn}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
</span>
<div style="flex:1;min-width:0">
<div style="font-size:16px;font-weight:600;color:{{t.tx}}">Still flooded at Jyothi?</div>
<div style="font-size:13px;color:{{t.tx3}};margin-top:2px">You passed it · 7 people confirmed</div>
</div>
<button aria-label="Not now" style="width:36px;height:36px;margin:-8px -8px 0 0;align-self:flex-start;border-radius:50%;border:0;background:transparent;display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.tx3}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
</div>
<div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<button style="height:48px;border-radius:14px;border:0;background:{{t.sf2}};color:{{t.tx}};font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 5 5 9-10"/></svg>Yes</button>
<button style="height:48px;border-radius:14px;border:0;background:{{t.sf2}};color:{{t.tx}};font-size:15px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>Cleared</button>
</div>
</div>

<div style="display:flex;flex-direction:column;gap:12px">
<div style="display:flex;align-items:center;justify-content:space-between">
<div style="display:flex;align-items:center;gap:8px">
<h2 style="margin:0;font-size:20px;font-weight:650;letter-spacing:-.015em;color:{{t.tx}}">Around you</h2>
<span style="width:6px;height:6px;border-radius:50%;background:{{t.ac}}"></span>
<span style="font-size:13px;color:{{t.tx3}}">09:42</span>
<span style="height:22px;padding:0 8px;border-radius:11px;border:1px dashed {{t.tx3}};font-size:11px;font-weight:600;color:{{t.tx2}};display:flex;align-items:center">Simulated</span>
</div>
<a href="05-live-map.html" style="font-size:14px;font-weight:600;color:{{t.ac}};padding:12px 0">Open map</a>
</div>
<a href="05-live-map.html" aria-label="Open live map" style="display:block;position:relative;height:168px;border-radius:24px;overflow:hidden;border:1px solid {{t.bd}}">
<dc-import name="MapBase" dark="{{t.dark}}" scene="traffic" offset="{{ 60 }}" hint-size="100%,168px"></dc-import>
<span style="position:absolute;left:12px;bottom:12px;height:30px;padding:0 10px;border-radius:15px;background:{{t.sf}};font-size:12px;font-weight:600;color:{{t.tx}};display:flex;align-items:center;gap:8px">3 reports within 2 km</span>
</a>
<div style="border-radius:24px;background:{{t.sf}};border:1px solid {{t.bd}};overflow:hidden">
<sc-for list="{{t.incidents}}" as="i" hint-placeholder-count="3">
<button style="width:100%;height:68px;border:0;border-top:{{i.sep}};background:none;display:flex;align-items:center;gap:12px;padding:0 16px;text-align:left">
<span style="width:40px;height:40px;border-radius:12px;background:{{i.ibg}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="{{i.ifg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg>
</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px">
<span style="font-size:15px;font-weight:600;color:{{i.t.tx}}">{{i.title}}</span>
<span style="font-size:13px;color:{{i.t.tx3}}">{{i.meta}}</span>
</span>
<span style="display:flex;align-items:center;gap:6px;flex-shrink:0">
<span style="display:flex;align-items:flex-end;gap:2px;height:12px">
<sc-for list="{{i.bars}}" as="b" hint-placeholder-count="6"><span style="width:3px;height:{{b.h}}px;border-radius:1px;background:{{b.c}}"></span></sc-for>
</span>
<span style="font-size:12px;font-weight:600;color:{{i.t.tx2}}">{{i.tier}}</span>
</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{i.t.tx3}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink:0;margin-right:-4px"><path d="m9 6 6 6-6 6"/></svg>
</button>
</sc-for>
</div>
</div>

<div style="display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:{{t.tx3}}">
<span style="display:flex;align-items:center;gap:6px"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{t.tx3}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4"/></svg>Location is used only when you report</span>
<span style="display:flex;gap:12px"><a href="14-privacy-legal.html" style="color:{{t.tx2}};font-weight:600">Privacy</a><a href="14-privacy-legal.html" style="color:{{t.tx2}};font-weight:600">Terms</a><a href="14-privacy-legal.html" style="color:{{t.tx2}};font-weight:600">Licenses</a><span>© OpenStreetMap</span></span>
</div>

</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:96px">
<dc-import name="NavBar" dark="{{t.dark}}" active="home" hint-size="390px,96px"></dc-import>
</div>
</div>
</div>
</sc-for>
</div>
</template>
<template id="tpl-MapBase">
<div style="width:100%;height:100%;overflow:hidden;background:{{c.land}};font-family:Inter,system-ui,sans-serif">
<svg width="100%" height="100%" viewBox="0 {{vy}} 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of central Mangaluru">

<path d="M250 0C240 140 300 260 290 400S330 600 300 844" pathLength="100" stroke="{{c.warn}}" stroke-width="5" stroke-dasharray="0 48 12 100"/>
</g>

<text x="118" y="752">Bolar</text>
<text x="146" y="418" font-size="14" font-weight="600">Mangaluru</text>
</g>

</div>
</template>
<template id="tpl-NavBar">
<div style="position:relative;width:390px;height:96px;font-family:Inter,system-ui,sans-serif">
<nav aria-label="Main" style="position:absolute;left:16px;bottom:16px;width:284px;height:64px;box-sizing:border-box;padding:5px;border-radius:32px;background:{{c.glass}};-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid {{c.edge}};box-shadow:{{c.sh}};display:flex">
<span class="ts-ind" aria-hidden="true" style="position:absolute;top:5px;left:5px;width:68px;height:52px;border-radius:26px;background:{{c.ind}};transform:{{indX}}"></span>
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<button class="ts-tab" aria-current="{{it.current}}" onClick="{{it.pick}}" style="position:relative;width:68px;height:52px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:inherit">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="{{it.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke:{{it.fg}}"><path d="{{it.d}}"/></svg>
<span style="font-size:11px;line-height:13px;font-weight:{{it.fw}};color:{{it.fg}};letter-spacing:.01em">{{it.label}}</span>
</button>
</sc-for>
</nav>
<button class="ts-fab" aria-label="Report a hazard" style="position:absolute;right:16px;bottom:16px;width:64px;height:64px;border-radius:32px;border:0;background:{{c.ac}};box-shadow:{{c.fabSh}};display:flex;align-items:center;justify-content:center;cursor:pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.onac}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>
</template>
<script src="../runtime/ts-runtime.js"></script>
<script>

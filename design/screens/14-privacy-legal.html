<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficSense · Privacy & legal</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0} button{font-family:inherit;cursor:pointer} a{text-decoration:none}</style>

<style>
body{margin:0}
.ts-tab{transition:transform 120ms cubic-bezier(.2,0,0,1);-webkit-tap-highlight-color:transparent}
.ts-tab:active{transform:scale(.9)}
.ts-tab svg,.ts-tab span{transition:color 200ms ease,stroke 200ms ease,font-weight 200ms ease}
.ts-fab{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.ts-fab:active{transform:scale(.9)}
.ts-ind{transition:transform 420ms cubic-bezier(.32,.72,0,1)}
</style>
<style>html,body{margin:0;background:#E8EBEE}#app{display:inline-block;min-width:100%}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-Legal">
<div style="width:1792px;height:952px;box-sizing:border-box;padding:32px;display:flex;gap:56px;background:#E8EBEE;font-family:Inter,system-ui,sans-serif">

<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px;width:390px">
<div style="height:28px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#4B555E">{{t.name}} · Home ⋯ menu</div>
<div style="width:390px;height:844px;border-radius:40px;overflow:hidden;position:relative;background:{{t.bg}};box-shadow:0 0 0 1px {{t.frame}}">
<div style="position:absolute;inset:0;padding:24px 20px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:20px">
<div style="display:flex;align-items:center;justify-content:space-between">
<div><div style="font-size:13px;font-weight:500;color:{{t.tx3}}">Thursday · Mangaluru · 27°</div><div style="margin-top:2px;font-size:28px;line-height:34px;font-weight:650;letter-spacing:-.025em;color:{{t.tx}}">Good morning</div></div>
<div style="width:96px"></div>
</div>
<div style="height:56px;border-radius:28px;border:1px solid {{t.bd}};background:{{t.sf}}"></div>
<div style="height:276px;border-radius:28px;background:{{t.hero}}"></div>
<div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px"><span style="height:88px;border-radius:20px;background:{{t.sf}};border:1px solid {{t.bd}}"></span><span style="height:88px;border-radius:20px;background:{{t.sf}};border:1px solid {{t.bd}}"></span><span style="height:88px;border-radius:20px;background:{{t.sf}};border:1px solid {{t.bd}}"></span></div>
</div>
<div style="position:absolute;inset:0;background:{{t.scrim}}"></div>
<div style="position:absolute;top:24px;right:20px;display:flex;gap:8px">
<span style="width:44px;height:44px;border-radius:50%;background:{{t.sf2}};display:flex;align-items:center;justify-content:center"><svg width="20" height="20" viewBox="0 0 24 24" fill="{{t.tx}}" aria-hidden="true"><circle cx="5" cy="12" r="1.8"/><circle cx="12" cy="12" r="1.8"/><circle cx="19" cy="12" r="1.8"/></svg></span>
<span style="width:44px;height:44px;border-radius:50%;background:{{t.acs}};color:{{t.ac}};font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center">A</span>
</div>
<div role="menu" style="position:absolute;top:76px;right:20px;width:240px;border-radius:20px;background:{{t.sf}};border:1px solid {{t.bd}};box-shadow:{{t.menuSh}};padding:6px">
<sc-for list="{{t.menu}}" as="m" hint-placeholder-count="5">
<sc-if value="{{m.sep}}" hint-placeholder-val="{{ false }}"><div style="height:1px;background:{{m.t.bd}};margin:6px 10px"></div></sc-if>
<a role="menuitem" href="{{m.href}}" style="height:44px;border-radius:12px;background:{{m.bg}};display:flex;align-items:center;gap:12px;padding:0 12px;font-size:15px;font-weight:500;color:{{m.t.tx}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{m.t.tx2}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"/></svg>{{m.label}}</a>
</sc-for>
</div>
<div style="position:absolute;left:0;right:0;bottom:0;height:96px">
<dc-import name="NavBar" dark="{{t.dark}}" active="home" hint-size="390px,96px"></dc-import>
</div>
</div>
</div>
</sc-for>

<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px;width:390px">
<div style="height:28px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#4B555E">{{t.name}} · Privacy &amp; legal</div>
<div style="width:390px;height:844px;border-radius:40px;overflow:hidden;position:relative;background:{{t.bg}};box-shadow:0 0 0 1px {{t.frame}};padding:16px 20px 28px;box-sizing:border-box;display:flex;flex-direction:column">
<a href="04-home.html" aria-label="Back" style="width:44px;height:44px;border-radius:50%;background:{{t.sf2}};display:flex;align-items:center;justify-content:center;margin-left:-4px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
</a>
<h1 style="margin:12px 0 0;font-size:28px;line-height:34px;font-weight:650;letter-spacing:-.025em;color:{{t.tx}}">Privacy &amp; legal</h1>
<p style="margin:6px 0 0;font-size:15px;line-height:21px;color:{{t.tx2}}">How TrafficSense handles your data.</p>

<div style="margin-top:24px;border-radius:24px;background:{{t.acs}};padding:18px;display:flex;flex-direction:column;gap:14px">
<sc-for list="{{t.promises}}" as="p" hint-placeholder-count="3">
<div style="display:flex;align-items:center;gap:12px">
<span style="width:32px;height:32px;border-radius:10px;background:{{p.t.sf}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{p.t.ac}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{p.d}}"/></svg>
</span>
<span style="font-size:14px;line-height:19px;font-weight:500;color:{{p.t.tx}}">{{p.text}}</span>
</div>
</sc-for>
</div>

<div style="margin-top:24px;border-radius:20px;background:{{t.sf}};border:1px solid {{t.bd}};overflow:hidden">
<sc-for list="{{t.docs}}" as="r" hint-placeholder-count="5">
<a href="14-privacy-legal.html" style="min-height:58px;border-top:{{r.sep}};display:flex;align-items:center;gap:14px;padding:0 14px">
<span style="width:34px;height:34px;border-radius:10px;background:{{r.t.sf2}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="{{r.t.tx}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.d}}"/></svg>
</span>
<span style="flex:1;display:flex;flex-direction:column;gap:1px;padding:10px 0"><span style="font-size:15px;font-weight:500;color:{{r.t.tx}}">{{r.label}}</span><span style="font-size:12px;color:{{r.t.tx3}}">{{r.sub}}</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{r.t.tx3}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{r.arrow}}"/></svg>
</a>
</sc-for>
</div>

<p style="margin:auto 0 0;text-align:center;font-size:12px;color:{{t.tx3}}">TrafficSense · Version 1.0.0</p>
</div>
</div>
</sc-for>

</div>
</template>
<template id="tpl-NavBar">
<div style="position:relative;width:390px;height:96px;font-family:Inter,system-ui,sans-serif">
<nav aria-label="Main" style="position:absolute;left:16px;bottom:16px;width:284px;height:64px;box-sizing:border-box;padding:5px;border-radius:32px;background:{{c.glass}};-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid {{c.edge}};box-shadow:{{c.sh}};display:flex">
<span class="ts-ind" aria-hidden="true" style="position:absolute;top:5px;left:5px;width:68px;height:52px;border-radius:26px;background:{{c.ind}};transform:{{indX}}"></span>
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<button class="ts-tab" aria-current="{{it.current}}" onClick="{{it.pick}}" style="position:relative;width:68px;height:52px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:inherit">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="{{it.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke:{{it.fg}}"><path d="{{it.d}}"/></svg>
<span style="font-size:11px;line-height:13px;font-weight:{{it.fw}};color:{{it.fg}};letter-spacing:.01em">{{it.label}}</span>
</button>
</sc-for>
</nav>
<button class="ts-fab" aria-label="Report a hazard" style="position:absolute;right:16px;bottom:16px;width:64px;height:64px;border-radius:32px;border:0;background:{{c.ac}};box-shadow:{{c.fabSh}};display:flex;align-items:center;justify-content:center;cursor:pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.onac}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>
</template>
<script src="../runtime/ts-runtime.js"></script>
<script>
TS.define('Legal', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const T = {
      light:{dark:false,name:'Light',bg:'#F5F6F7',sf:'#FFFFFF',sf2:'#EEF0F2',bd:'#E2E5E8',tx:'#121619',tx2:'#4B555E',tx3:'#68737D',ac:'#0B6B5F',acs:'#E2F0ED',frame:'#D9DDE1',hero:'#0E1A19',scrim:'rgba(18,22,25,.28)',menuSh:'0 1px 2px rgba(16,24,32,.06), 0 16px 40px rgba(16,24,32,.16)'},
      dark:{dark:true,name:'Dark',bg:'#0B0F10',sf:'#13181A',sf2:'#1B2124',bd:'#252D30',tx:'#EEF2F3',tx2:'#A9B4B8',tx3:'#8A969B',ac:'#56C7B3',acs:'#0F2C28',frame:'#252D30',hero:'#13201E',scrim:'rgba(0,0,0,.5)',menuSh:'0 1px 0 rgba(255,255,255,.04) inset, 0 16px 40px rgba(0,0,0,.6)'}
    };
    const M = [
      {label:'Settings',href:'Me.dc.html',d:'M12 8a4 4 0 1 0 0 8a4 4 0 1 0 0-8zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1'},
      {label:'Help & feedback',href:'Legal.dc.html',d:'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6V14M12 17h.01'},
      {label:'Privacy policy',href:'Legal.dc.html',sep:true,hl:true,d:'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z'},
      {label:'Terms of use',href:'Legal.dc.html',d:'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6'},
      {label:'Licenses',href:'Legal.dc.html',d:'M4 6h16M4 12h16M4 18h10'}
    ];
    const P = [
      {text:'Location is used only when you send a report',d:'M3 11 21 3l-8 18-2-8z'},
      {text:'Location data is removed from photos',d:'M4 8h3l2-3h6l2 3h3v11H4zM8.5 13a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0'},
      {text:'Reports keep no personal trail',d:'M6 11h12v10H6zM8 11V7a4 4 0 0 1 8 0v4'}
    ];
    const ext = 'M14 4h6v6M20 4l-9 9M18 14v6H4V6h6';
    const chev = 'm9 6 6 6-6 6';
    const Dc = [
      {label:'Privacy policy',sub:'What we collect and why',d:'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6z',arrow:chev},
      {label:'Terms of use',sub:'Rules for reports and accounts',d:'M7 3h7l5 5v13H7zM14 3v5h5M10 13h6M10 17h6',arrow:chev},
      {label:'Open-source licenses',sub:'Software this app is built on',d:'M4 6h16M4 12h16M4 18h10',arrow:chev},
      {label:'Map data',sub:'© OpenStreetMap contributors · ODbL',d:'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',arrow:ext},
      {label:'Your data',sub:'Ask for a copy or deletion',d:'M4 6h16v12H4zM4 7l8 6 8-6',arrow:chev}
    ];
    const themes = [T.light, T.dark].map(t => ({
      ...t,
      menu: M.map(m => ({...m, t, sep: !!m.sep, bg: m.hl ? t.sf2 : 'transparent'})),
      promises: P.map(p => ({...p, t})),
      docs: Dc.map((r,k) => ({...r, t, sep: k ? '1px solid ' + t.bd : '0'}))
    }));
    return { themes };
  }
}
return Component;
}, 'tpl-Legal');
TS.define('NavBar', function (DCLogic) {
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cur: null }; }
  renderVals() {
    const dark = !!this.props.dark;
    const c = dark
      ? { glass:'rgba(27,33,36,.86)', edge:'rgba(255,255,255,.07)', sh:'0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.55)', ind:'#173B35', tx:'#EEF2F3', tx3:'#8A969B', ac:'#56C7B3', onac:'#03211C', fabSh:'0 10px 24px rgba(0,0,0,.5)' }
      : { glass:'rgba(255,255,255,.9)', edge:'rgba(16,24,32,.06)', sh:'0 1px 2px rgba(16,24,32,.06), 0 10px 30px rgba(16,24,32,.12)', ind:'#E2F0ED', tx:'#0B6B5F', tx3:'#5F6A73', ac:'#0B6B5F', onac:'#FFFFFF', fabSh:'0 1px 2px rgba(16,24,32,.12), 0 10px 24px rgba(16,24,32,.18)' };
    const auth = (this.props.role ?? 'commuter') === 'authority';
    const cur = this.state.cur ?? this.props.active ?? 'home';
    const D = {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      map: 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
      plan: 'M4 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0M16 5a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16',
      me: auth ? 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6zM9 12l2 2 4-4' : 'M8 8a4 4 0 1 0 8 0a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0'
    };
    const ids = ['home', 'map', 'plan', 'me'];
    const labels = { home: 'Home', map: 'Map', plan: 'Plan', me: auth ? 'Ops' : 'Me' };
    const idx = Math.max(0, ids.indexOf(cur));
    const items = ids.map(id => ({
      id, label: labels[id], d: D[id],
      fg: id === cur ? c.tx : c.tx3,
      fw: id === cur ? 600 : 500,
      sw: id === cur ? 2.1 : 1.8,
      current: id === cur ? 'page' : 'false',
      pick: () => this.setState({ cur: id })
    }));
    return { c, items, indX: 'translateX(' + (idx * 68) + 'px)' };
  }
}
return Component;
}, 'tpl-NavBar');
TS.mount('Legal', document.getElementById('app'));
</script>
</body>
</html>

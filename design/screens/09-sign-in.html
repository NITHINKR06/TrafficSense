<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficSense · Sign in</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0} button,input{font-family:inherit} button{cursor:pointer} a{text-decoration:none}</style>
<style>html,body{margin:0;background:#E8EBEE}#app{display:inline-block;min-width:100%}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-SignIn">
<div style="width:1792px;height:952px;box-sizing:border-box;padding:32px;display:flex;gap:56px;background:#E8EBEE;font-family:Inter,system-ui,sans-serif">
<sc-for list="{{phones}}" as="t" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;gap:16px;width:390px">
<div style="height:28px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#4B555E">{{t.label}}</div>
<div style="width:390px;height:844px;border-radius:40px;overflow:hidden;position:relative;background:{{t.bg}};box-shadow:0 0 0 1px {{t.frame}};padding:16px 24px 24px;box-sizing:border-box;display:flex;flex-direction:column">

<a href="02-welcome.html" aria-label="Back" style="width:44px;height:44px;border-radius:50%;background:{{t.sf2}};display:flex;align-items:center;justify-content:center;margin-left:-8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
</a>

<div style="margin-top:4px;display:flex;flex-direction:column;align-items:center;text-align:center">
<img src="../assets/icon.png" alt="" style="width:56px;height:56px;border-radius:14px;display:block;box-shadow:{{t.iconSh}}">
<h1 style="margin:16px 0 0;font-size:28px;line-height:34px;font-weight:650;letter-spacing:-.025em;color:{{t.tx}}">Welcome back</h1>
<p style="margin:6px 0 0;font-size:15px;line-height:21px;color:{{t.tx2}}">Sign in to report and confirm hazards.</p>
</div>

<button style="margin-top:24px;height:52px;border-radius:16px;border:1px solid {{t.bdStrong}};background:{{t.googleBg}};color:{{t.tx}};font-size:16px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:12px">
<span aria-hidden="true" style="width:22px;height:22px;border-radius:11px;border:1.5px solid {{t.tx2}};box-sizing:border-box;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:{{t.tx}}">G</span>Continue with Google</button>

<div style="margin:18px 0;display:flex;align-items:center;gap:12px;font-size:13px;color:{{t.tx3}}"><span style="flex:1;height:1px;background:{{t.bd}}"></span>or with email<span style="flex:1;height:1px;background:{{t.bd}}"></span></div>

<label style="height:60px;border-radius:16px;border:{{t.emailBd}};background:{{t.sf}};padding:8px 15px 0;box-sizing:border-box;display:flex;flex-direction:column;gap:2px">
<span style="font-size:12px;font-weight:600;color:{{t.emailLab}}">Email</span>
<input type="email" value="{{t.emailVal}}" placeholder="you@example.com" style="border:0;outline:0;background:transparent;padding:0;font-size:16px;color:{{t.tx}}"/>
</label>
<label style="margin-top:12px;height:60px;border-radius:16px;border:{{t.passBd}};background:{{t.sf}};padding:8px 4px 0 15px;box-sizing:border-box;display:flex;align-items:center;gap:4px">
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;align-self:stretch">
<span style="font-size:12px;font-weight:600;color:{{t.passLab}}">Password</span>
<input type="password" value="{{t.passVal}}" placeholder="Your password" style="border:0;outline:0;background:transparent;padding:0;font-size:16px;color:{{t.tx}}"/>
</span>
<button aria-label="Show password" style="width:44px;height:44px;border:0;background:none;display:flex;align-items:center;justify-content:center;margin-top:-8px">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.tx3}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12zM9 12a3 3 0 1 0 6 0a3 3 0 1 0-6 0"/></svg>
</button>
</label>
<div style="margin-top:6px;min-height:32px;display:flex;align-items:center;justify-content:space-between;gap:12px">
<span role="alert" style="display:flex;align-items:center;gap:6px;font-size:13px;color:{{t.dg}};visibility:{{t.errVis}}">
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.dg}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 8v5M12 16h.01"/></svg>Wrong email or password</span>
<a href="09-sign-in.html" style="height:32px;display:flex;align-items:center;font-size:13px;font-weight:600;color:{{t.ac}};flex-shrink:0">Forgot password?</a>
</div>

<button style="margin-top:12px;height:52px;border-radius:16px;border:0;background:{{t.ac}};color:{{t.onac}};font-size:16px;font-weight:600">Sign in</button>
<p style="margin:16px 0 0;text-align:center;font-size:14px;color:{{t.tx2}}">New here? <a href="10-create-account.html" style="font-weight:600;color:{{t.ac}}">Create account</a></p>

<div style="margin-top:auto;display:flex;flex-direction:column;gap:8px">
<button style="height:56px;border-radius:18px;border:1px dashed {{t.tx3}};background:transparent;display:flex;align-items:center;gap:12px;padding:0 14px;text-align:left">
<span style="width:32px;height:32px;border-radius:10px;background:{{t.sf2}};display:flex;align-items:center;justify-content:center;flex-shrink:0"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/></svg></span>
<span style="flex:1;display:flex;flex-direction:column"><span style="font-size:14px;font-weight:600;color:{{t.tx}}">Try a demo account</span><span style="font-size:12px;color:{{t.tx3}}">Test data · no sign-up needed</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.tx3}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
</button>
<a href="04-home.html" style="height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;color:{{t.tx}}">Continue as guest</a>
<p style="margin:0;text-align:center;font-size:12px;line-height:17px;color:{{t.tx3}}">By continuing you agree to the <a href="14-privacy-legal.html" style="color:{{t.tx2}};font-weight:600;text-decoration:underline">Terms</a> and <a href="14-privacy-legal.html" style="color:{{t.tx2}};font-weight:600;text-decoration:underline">Privacy Policy</a>.</p>
</div>
</div>
</div>
</sc-for>
</div>
</template>
<script src="../runtime/ts-runtime.js"></script>
<script>
TS.define('SignIn', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const T = {
      light:{dark:false,name:'Light',bg:'#F5F6F7',sf:'#FFFFFF',sf2:'#EEF0F2',bd:'#E2E5E8',bdStrong:'#D5DADE',tx:'#121619',tx2:'#4B555E',tx3:'#68737D',ac:'#0B6B5F',onac:'#FFFFFF',dg:'#B42318',googleBg:'#FFFFFF',frame:'#D9DDE1',iconSh:'0 1px 2px rgba(16,24,32,.08), 0 8px 20px rgba(16,24,32,.12)'},
      dark:{dark:true,name:'Dark',bg:'#0B0F10',sf:'#13181A',sf2:'#1B2124',bd:'#252D30',bdStrong:'#2E373B',tx:'#EEF2F3',tx2:'#A9B4B8',tx3:'#8A969B',ac:'#56C7B3',onac:'#03211C',dg:'#F7897D',googleBg:'#13181A',frame:'#252D30',iconSh:'0 8px 20px rgba(0,0,0,.5)'}
    };
    const make = (t, err) => ({
      ...t,
      label: t.name + (err ? ' · wrong password' : ' · default'),
      emailBd: '1px solid ' + t.bd, emailLab: t.tx3,
      emailVal: err ? 'commuter@demo.trafficsense.test' : '',
      passBd: err ? '2px solid ' + t.dg : '1px solid ' + t.bd,
      passLab: err ? t.dg : t.tx3,
      passVal: err ? 'password123' : '',
      errVis: err ? 'visible' : 'hidden'
    });
    return { phones: [make(T.light,false), make(T.dark,false), make(T.light,true), make(T.dark,true)] };
  }
}
return Component;
}, 'tpl-SignIn');
TS.mount('SignIn', document.getElementById('app'));
</script>
</body>
</html>

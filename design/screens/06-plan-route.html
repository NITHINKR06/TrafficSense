<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficSense · Plan route</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0} button{font-family:inherit;cursor:pointer}</style>

<style>body{margin:0}</style>

<style>
body{margin:0}
.ts-tab{transition:transform 120ms cubic-bezier(.2,0,0,1);-webkit-tap-highlight-color:transparent}
.ts-tab:active{transform:scale(.9)}
.ts-tab svg,.ts-tab span{transition:color 200ms ease,stroke 200ms ease,font-weight 200ms ease}
.ts-fab{transition:transform 140ms cubic-bezier(.2,0,0,1)}
.ts-fab:active{transform:scale(.9)}
.ts-ind{transition:transform 420ms cubic-bezier(.32,.72,0,1)}
</style>
<style>html,body{margin:0;background:#E8EBEE}#app{display:inline-block;min-width:100%}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-Plan">
<div style="width:900px;height:952px;box-sizing:border-box;padding:32px;display:flex;gap:56px;background:#E8EBEE;font-family:Inter,system-ui,sans-serif">
<sc-for list="{{themes}}" as="t" hint-placeholder-count="2">
<div style="display:flex;flex-direction:column;gap:16px;width:390px">
<div style="height:28px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#4B555E">{{t.name}}</div>
<div style="width:390px;height:844px;border-radius:40px;overflow:hidden;position:relative;background:{{t.bg}};box-shadow:0 0 0 1px {{t.frame}}">
<div style="position:absolute;inset:0">
<dc-import name="MapBase" dark="{{t.dark}}" scene="route" offset="{{ 118 }}" hint-size="100%,100%"></dc-import>
</div>

<div style="position:absolute;top:16px;left:16px;right:16px;border-radius:24px;background:{{t.sf}};box-shadow:{{t.sh}};border:1px solid {{t.edge}};padding:4px 8px 4px 16px;display:flex;align-items:center;gap:10px">
<div style="display:flex;flex-direction:column;align-items:center;width:14px;flex-shrink:0">
<span style="width:12px;height:12px;border-radius:50%;border:3.5px solid {{t.ac}};box-sizing:border-box"></span>
<span style="width:2px;height:30px;background-image:linear-gradient({{t.tx3}} 50%, transparent 50%);background-size:2px 6px;margin:4px 0"></span>
<svg width="14" height="14" viewBox="0 0 24 24" fill="{{t.tx}}" aria-hidden="true"><path d="M12 22s7-6.3 7-12a7 7 0 0 0-14 0c0 5.7 7 12 7 12z"/></svg>
</div>
<div style="flex:1;min-width:0">
<button style="width:100%;height:50px;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;justify-content:center">
<span style="font-size:12px;color:{{t.tx3}}">From</span><span style="font-size:15px;font-weight:600;color:{{t.tx}}">Hampankatta Junction</span>
</button>
<div style="height:1px;background:{{t.bd}}"></div>
<button style="width:100%;height:50px;border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;justify-content:center">
<span style="font-size:12px;color:{{t.tx3}}">To</span><span style="font-size:15px;font-weight:600;color:{{t.tx}}">KSRTC · Bejai Circle</span>
</button>
</div>
<button aria-label="Swap start and destination" style="width:44px;height:44px;border-radius:50%;border:0;background:{{t.sf2}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4v16M4 7l3-3 3 3M17 20V4M14 17l3 3 3-3"/></svg>
</button>
</div>

<div style="position:absolute;right:16px;bottom:470px;border-radius:22px;background:{{t.sf}};box-shadow:{{t.sh}};border:1px solid {{t.edge}}">
<button aria-label="Show my location" style="width:44px;height:44px;border:0;background:transparent;display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="{{t.ac}}" stroke="{{t.ac}}" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8z"/></svg>
</button>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;background:{{t.sheet}};border-radius:28px 28px 0 0;box-shadow:{{t.sheetSh}};padding:8px 20px 104px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px">
<div style="width:36px;height:5px;border-radius:3px;background:{{t.handle}};align-self:center"></div>
<div style="display:flex;align-items:center;justify-content:space-between">
<h2 style="margin:0;font-size:20px;font-weight:650;color:{{t.tx}};letter-spacing:-.015em">Routes</h2>
<div style="display:flex;gap:8px">
<button style="height:36px;padding:0 10px 0 12px;border-radius:18px;border:1px solid {{t.bd}};background:{{t.sf}};color:{{t.tx}};font-size:13px;font-weight:600;display:flex;align-items:center;gap:4px">Leave now
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.tx2}}" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button>
<button aria-pressed="false" aria-label="Prefer bus corridor" style="width:36px;height:36px;border-radius:18px;border:1px solid {{t.bd}};background:{{t.sf}};display:flex;align-items:center;justify-content:center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4h12a1 1 0 0 1 1 1v11H5V5a1 1 0 0 1 1-1zM5 11h14M8 16v3M16 16v3"/></svg></button>
</div>
</div>

<div role="radiogroup" style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px">
<button role="radio" aria-checked="true" style="height:84px;border-radius:20px;border:2px solid {{t.ac}};background:{{t.acs}};padding:0 16px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:4px">
<span style="font-size:24px;font-weight:650;color:{{t.tx}};letter-spacing:-.02em;font-variant-numeric:tabular-nums">18 min</span>
<span style="font-size:13px;font-weight:600;color:{{t.ac}}">Fastest · 6.2 km</span>
</button>
<button role="radio" aria-checked="false" style="height:84px;border-radius:20px;border:1px solid {{t.bd}};background:{{t.sf}};padding:0 17px;text-align:left;display:flex;flex-direction:column;justify-content:center;gap:4px">
<span style="font-size:24px;font-weight:650;color:{{t.tx}};letter-spacing:-.02em;font-variant-numeric:tabular-nums">21 min</span>
<span style="font-size:13px;font-weight:500;color:{{t.tx2}}">No reports · 6.8 km</span>
</button>
</div>

<div style="display:flex;flex-direction:column;gap:8px">
<div style="display:flex;justify-content:space-between;font-size:13px"><span style="font-weight:600;color:{{t.tx}}">Arrive 10:32 <span style="font-weight:400;color:{{t.tx3}}">· via Kadri bypass</span></span><span style="height:20px;padding:0 8px;border-radius:10px;border:1px dashed {{t.tx3}};font-size:11px;font-weight:600;color:{{t.tx2}};display:flex;align-items:center">Corridor model</span></div>
<div style="display:flex;gap:3px;height:8px">
<span style="flex:38;border-radius:4px;background:{{t.ac}}"></span>
<span style="flex:14;border-radius:4px;background:{{t.wnBar}}"></span>
<span style="flex:48;border-radius:4px;background:{{t.ac}}"></span>
</div>
<div style="display:flex;justify-content:space-between;font-size:11px;font-weight:500;color:{{t.tx3}}"><span>Hampankatta</span><span>Jyothi · slow</span><span>Bejai</span></div>
</div>

<button style="height:48px;border-radius:14px;border:0;background:{{t.wns}};padding:0 12px 0 14px;display:flex;align-items:center;gap:10px;text-align:left">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{t.wn}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></svg>
<span style="flex:1;font-size:14px;font-weight:600;color:{{t.wn}}">Flooding at Jyothi Circle</span>
<span style="font-size:12px;color:{{t.wn}}">L3</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.wn}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
</button>

<div style="display:flex;gap:10px">
<button style="flex:1;height:52px;border-radius:16px;border:0;background:{{t.ac}};color:{{t.onac}};font-size:16px;font-weight:600">Start journey</button>
<button aria-label="Save route" style="width:52px;height:52px;border-radius:16px;border:1px solid {{t.bd}};background:{{t.sf}};display:flex;align-items:center;justify-content:center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3h12v18l-6-4-6 4z"/></svg>
</button>
</div>
</div>

<div style="position:absolute;left:0;right:0;bottom:0;height:96px">
<dc-import name="NavBar" dark="{{t.dark}}" active="plan" hint-size="390px,96px"></dc-import>
</div>
</div>
</div>
</sc-for>
</div>
</template>
<template id="tpl-MapBase">
<div style="width:100%;height:100%;overflow:hidden;background:{{c.land}};font-family:Inter,system-ui,sans-serif">
<svg width="100%" height="100%" viewBox="0 {{vy}} 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of central Mangaluru">
<rect y="-300" width="390" height="1444" fill="{{c.land}}"/>
<ellipse cx="300" cy="250" rx="42" ry="28" fill="{{c.park}}"/>
<ellipse cx="128" cy="575" rx="32" ry="20" fill="{{c.park}}"/>
<ellipse cx="345" cy="520" rx="26" ry="36" fill="{{c.park}}"/>
<path d="M0 -300H80C66 -100 60 0 72 0C60 120 84 220 66 330C52 430 80 520 60 640C48 720 72 790 58 844C50 950 66 1050 60 1144H0Z" fill="{{c.water}}"/>
<path d="M66 170C140 150 200 190 260 160S360 120 390 140" stroke="{{c.water}}" stroke-width="16" fill="none"/>
<path d="M60 700C140 676 200 728 280 706S360 656 390 676" stroke="{{c.water}}" stroke-width="34" fill="none"/>
<g stroke="{{c.road}}" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M90 262H360M100 384H380M110 522H370M84 610H360M150 110V660M210 130V680M330 200V640M90 444C180 432 260 472 380 452M96 330C160 340 220 320 300 336M120 40H380M100 800H380"/>
</g>
<g fill="none" stroke-linecap="round">
<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.major}}" stroke-width="6"/>
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" stroke="{{c.major}}" stroke-width="6"/>
</g>
<g opacity="{{trafficOp}}" fill="none" stroke-linecap="round">
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" pathLength="100" stroke="{{c.warn}}" stroke-width="5" stroke-dasharray="0 22 20 100"/>
<path d="M250 0C240 140 300 260 290 400S330 600 300 844" pathLength="100" stroke="{{c.danger}}" stroke-width="5" stroke-dasharray="0 38 10 100"/>
<path d="M250 0C240 140 300 260 290 400S330 600 300 844" pathLength="100" stroke="{{c.warn}}" stroke-width="5" stroke-dasharray="0 48 12 100"/>
</g>
<g font-size="11" font-weight="500" fill="{{c.label}}" letter-spacing=".01em">
<text x="168" y="232">Urwa</text>
<text x="98" y="300">Ladyhill</text>
<text x="300" y="282">Bejai</text>
<text x="232" y="356">Kadri</text>
<text x="96" y="500">Hampankatta</text>
<text x="226" y="560">Kankanady</text>
<text x="300" y="636">Pumpwell</text>
<text x="118" y="752">Bolar</text>
<text x="146" y="418" font-size="14" font-weight="600">Mangaluru</text>
</g>

<g opacity="{{routeOp}}" fill="none" stroke-linecap="round">
<path d="M140 478C140 420 180 360 230 330S270 300 282 300" stroke="{{c.casingRoute}}" stroke-width="9"/>
<path d="M140 478C140 420 180 360 230 330S270 300 282 300" stroke="{{c.alt}}" stroke-width="5"/>
<path d="M140 478C170 470 190 440 215 420S250 330 282 300" stroke="{{c.casingRoute}}" stroke-width="12"/>
<path d="M140 478C170 470 190 440 215 420S250 330 282 300" stroke="{{c.route}}" stroke-width="7"/>
<circle cx="140" cy="478" r="8" fill="{{c.casingRoute}}" stroke="{{c.route}}" stroke-width="4"/>
<g transform="translate(282 300)">
<path d="M0 0C-3-5-11-11-11-19A11 11 0 1 1 11-19C11-11 3-5 0 0Z" fill="{{c.ink}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<circle cy="-19" r="4" fill="{{c.casingRoute}}"/>
</g>
</g>
<g opacity="{{bubbleOp}}" font-size="12" font-weight="600">
<rect x="226" y="400" width="62" height="26" rx="13" fill="{{c.route}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<text x="257" y="417.5" text-anchor="middle" fill="{{c.onRoute}}">18 min</text>
<rect x="104" y="340" width="62" height="26" rx="13" fill="{{c.bubble}}" stroke="{{c.bubbleBd}}" stroke-width="1"/>
<text x="135" y="357.5" text-anchor="middle" fill="{{c.ink}}">21 min</text>
<g transform="translate(206 432)">
<circle r="10" fill="{{c.warn}}" stroke="{{c.casingRoute}}" stroke-width="2.5"/>
<path d="M0-5v5M0 3.5v.5" stroke="{{c.casingRoute}}" stroke-width="2.2" stroke-linecap="round"/>
</g>
</g>

<g opacity="{{pinOp}}">
<g transform="translate(262 380)">
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.danger}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M-4.5-20h9" stroke="{{c.casingRoute}}" stroke-width="2.2" stroke-linecap="round"/>
</g>
<g transform="translate(176 604)">
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.neutral}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M-2-25h4l3 9h-10z" fill="none" stroke="{{c.casingRoute}}" stroke-width="1.8" stroke-linejoin="round"/>
</g>
<g transform="translate(212 505) scale(1.3)">
<ellipse cy="1" rx="6" ry="2" fill="{{c.ink}}" opacity=".18"/>
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.warn}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M0-27s4.5 4.5 4.5 7.5a4.5 4.5 0 0 1-9 0c0-3 4.5-7.5 4.5-7.5z" fill="{{c.casingRoute}}"/>
</g>
</g>
<g opacity="{{youOp}}">
<path d="M150 528 168 520 186 528 176 494H160Z" fill="{{c.route}}" opacity=".16" transform="rotate(200 168 520)"/>
<circle cx="168" cy="520" r="9" fill="{{c.route}}" stroke="{{c.casingRoute}}" stroke-width="3.5"/>
</g>
</svg>
</div>
</template>
<template id="tpl-NavBar">
<div style="position:relative;width:390px;height:96px;font-family:Inter,system-ui,sans-serif">
<nav aria-label="Main" style="position:absolute;left:16px;bottom:16px;width:284px;height:64px;box-sizing:border-box;padding:5px;border-radius:32px;background:{{c.glass}};-webkit-backdrop-filter:blur(20px) saturate(160%);backdrop-filter:blur(20px) saturate(160%);border:1px solid {{c.edge}};box-shadow:{{c.sh}};display:flex">
<span class="ts-ind" aria-hidden="true" style="position:absolute;top:5px;left:5px;width:68px;height:52px;border-radius:26px;background:{{c.ind}};transform:{{indX}}"></span>
<sc-for list="{{items}}" as="it" hint-placeholder-count="4">
<button class="ts-tab" aria-current="{{it.current}}" onClick="{{it.pick}}" style="position:relative;width:68px;height:52px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;cursor:pointer;font-family:inherit">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke-width="{{it.sw}}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="stroke:{{it.fg}}"><path d="{{it.d}}"/></svg>
<span style="font-size:11px;line-height:13px;font-weight:{{it.fw}};color:{{it.fg}};letter-spacing:.01em">{{it.label}}</span>
</button>
</sc-for>
</nav>
<button class="ts-fab" aria-label="Report a hazard" style="position:absolute;right:16px;bottom:16px;width:64px;height:64px;border-radius:32px;border:0;background:{{c.ac}};box-shadow:{{c.fabSh}};display:flex;align-items:center;justify-content:center;cursor:pointer">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.onac}}" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
</button>
</div>
</template>
<script src="../runtime/ts-runtime.js"></script>
<script>
TS.define('Plan', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const T = {
      light:{dark:false,name:'Light',bg:'#F5F6F7',sf:'#FFFFFF',sf2:'#EEF0F2',bd:'#E2E5E8',tx:'#121619',tx2:'#4B555E',tx3:'#68737D',ac:'#0B6B5F',acs:'#E2F0ED',onac:'#FFFFFF',wn:'#9A5700',wns:'#FCF0DF',wnBar:'#D27A12',frame:'#D9DDE1',edge:'rgba(16,24,32,.05)',sheet:'#F7F8F9',handle:'#D3D8DC',sh:'0 1px 2px rgba(16,24,32,.06), 0 8px 24px rgba(16,24,32,.10)',shSm:'0 1px 2px rgba(16,24,32,.08)',sheetSh:'0 -1px 0 rgba(16,24,32,.04), 0 -12px 32px rgba(16,24,32,.10)'},
      dark:{dark:true,name:'Dark',bg:'#0B0F10',sf:'#13181A',sf2:'#1B2124',bd:'#252D30',tx:'#EEF2F3',tx2:'#A9B4B8',tx3:'#8A969B',ac:'#56C7B3',acs:'#0F2C28',onac:'#03211C',wn:'#F2AA55',wns:'#2A2013',wnBar:'#F2AA55',frame:'#252D30',edge:'rgba(255,255,255,.07)',sheet:'#0F1415',handle:'#3A4448',sh:'0 1px 0 rgba(255,255,255,.04) inset, 0 8px 24px rgba(0,0,0,.5)',shSm:'0 1px 2px rgba(0,0,0,.4)',sheetSh:'0 -1px 0 rgba(255,255,255,.06), 0 -12px 32px rgba(0,0,0,.5)'}
    };
    return { themes: [T.light, T.dark] };
  }
}
return Component;
}, 'tpl-Plan');
TS.define('MapBase', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const scene = this.props.scene ?? 'traffic';
    const c = dark
      ? { land:'#121618', park:'#142019', water:'#0C1B22', road:'#1F2528', casing:'#121618', major:'#343C41', label:'#7C878E', route:'#56C7B3', onRoute:'#03211C', casingRoute:'#0B0F10', alt:'#4E595F', warn:'#F2AA55', danger:'#F7897D', neutral:'#A9B4B8', ink:'#EEF2F3', bubble:'#1B2124', bubbleBd:'#2E373B' }
      : { land:'#F2F3F0', park:'#E1EADB', water:'#CFE0E9', road:'#FFFFFF', casing:'#DDE0DA', major:'#FFFFFF', label:'#6B757E', route:'#0B6B5F', onRoute:'#FFFFFF', casingRoute:'#FFFFFF', alt:'#A3ACB3', warn:'#D27A12', danger:'#CC3B2E', neutral:'#4B555E', ink:'#121619', bubble:'#FFFFFF', bubbleBd:'#D5D9DD' };
    return {
      c,
      vy: this.props.offset ?? 0,
      routeOp: scene === 'route' || scene === 'preview' ? 1 : 0,
      bubbleOp: scene === 'route' ? 1 : 0,
      pinOp: scene === 'traffic' ? 1 : 0,
      trafficOp: scene === 'traffic' || scene === 'route' ? 1 : 0,
      youOp: scene === 'traffic' ? 1 : 0
    };
  }
}
return Component;
}, 'tpl-MapBase');
TS.define('NavBar', function (DCLogic) {
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { cur: null }; }
  renderVals() {
    const dark = !!this.props.dark;
    const c = dark
      ? { glass:'rgba(27,33,36,.86)', edge:'rgba(255,255,255,.07)', sh:'0 1px 0 rgba(255,255,255,.04) inset, 0 10px 30px rgba(0,0,0,.55)', ind:'#173B35', tx:'#EEF2F3', tx3:'#8A969B', ac:'#56C7B3', onac:'#03211C', fabSh:'0 10px 24px rgba(0,0,0,.5)' }
      : { glass:'rgba(255,255,255,.9)', edge:'rgba(16,24,32,.06)', sh:'0 1px 2px rgba(16,24,32,.06), 0 10px 30px rgba(16,24,32,.12)', ind:'#E2F0ED', tx:'#0B6B5F', tx3:'#5F6A73', ac:'#0B6B5F', onac:'#FFFFFF', fabSh:'0 1px 2px rgba(16,24,32,.12), 0 10px 24px rgba(16,24,32,.18)' };
    const auth = (this.props.role ?? 'commuter') === 'authority';
    const cur = this.state.cur ?? this.props.active ?? 'home';
    const D = {
      home: 'M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z',
      map: 'M9 4 3 6v14l6-2 6 2 6-2V4l-6 2-6-2zM9 4v14M15 6v14',
      plan: 'M4 19a2 2 0 1 0 4 0a2 2 0 1 0-4 0M16 5a2 2 0 1 0 4 0a2 2 0 1 0-4 0M8 19h8.5a3.5 3.5 0 0 0 0-7h-9a3.5 3.5 0 0 1 0-7H16',
      me: auth ? 'M12 3 4 6v6c0 5 3.5 8 8 9 4.5-1 8-4 8-9V6zM9 12l2 2 4-4' : 'M8 8a4 4 0 1 0 8 0a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0'
    };
    const ids = ['home', 'map', 'plan', 'me'];
    const labels = { home: 'Home', map: 'Map', plan: 'Plan', me: auth ? 'Ops' : 'Me' };
    const idx = Math.max(0, ids.indexOf(cur));
    const items = ids.map(id => ({
      id, label: labels[id], d: D[id],
      fg: id === cur ? c.tx : c.tx3,
      fw: id === cur ? 600 : 500,
      sw: id === cur ? 2.1 : 1.8,
      current: id === cur ? 'page' : 'false',
      pick: () => this.setState({ cur: id })
    }));
    return { c, items, indX: 'translateX(' + (idx * 68) + 'px)' };
  }
}
return Component;
}, 'tpl-NavBar');
TS.mount('Plan', document.getElementById('app'));
</script>

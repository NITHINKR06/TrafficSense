<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficSense · Report a hazard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0} button,input{font-family:inherit} button{cursor:pointer} a{text-decoration:none}
@keyframes rpPop{0%{transform:scale(.4);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:none;opacity:1}}
@keyframes rpDraw{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes rpRing{from{transform:scale(.8);opacity:.6}to{transform:scale(1.6);opacity:0}}
@keyframes rpRise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.rp-pop{animation:rpPop 520ms cubic-bezier(.34,1.56,.64,1) 200ms both}
.rp-check{stroke-dasharray:24;animation:rpDraw 360ms cubic-bezier(.65,0,.35,1) 560ms both}
.rp-ring{animation:rpRing 900ms cubic-bezier(0,0,.2,1) 560ms both}
.rp-rise{animation:rpRise 420ms cubic-bezier(0,0,0,1) both}
</style>

<style>body{margin:0}</style>
<style>html,body{margin:0;background:#E8EBEE}#app{display:inline-block;min-width:100%}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-Report">
<div style="width:1792px;height:952px;box-sizing:border-box;padding:32px;display:flex;gap:56px;background:#E8EBEE;font-family:Inter,system-ui,sans-serif">
<sc-for list="{{phones}}" as="t" hint-placeholder-count="4">
<div style="display:flex;flex-direction:column;gap:16px;width:390px">
<div style="height:28px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#4B555E">{{t.label}}</div>
<div style="width:390px;height:844px;border-radius:40px;overflow:hidden;position:relative;background:{{t.bg}};box-shadow:0 0 0 1px {{t.frame}}">

<div style="position:absolute;inset:0">
<dc-import name="MapBase" dark="{{t.dark}}" scene="traffic" offset="{{ 330 }}" hint-size="100%,100%"></dc-import>
</div>
<div style="position:absolute;inset:0;background:{{t.scrim}}"></div>
<svg width="34" height="44" viewBox="-14 -36 28 38" style="position:absolute;left:151px;top:126px" role="img" aria-label="Report location">
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{t.ac}}" stroke="{{t.pinBd}}" stroke-width="2"/>
<circle cy="-20" r="4.5" fill="{{t.pinBd}}"/>
</svg>
<span style="position:absolute;left:112px;top:84px;height:28px;padding:0 10px;border-radius:14px;background:{{t.sf}};box-shadow:{{t.shSm}};font-size:12px;font-weight:600;color:{{t.tx}};display:flex;align-items:center">{{t.pinLabel}}</span>

<sc-if value="{{t.compose}}" hint-placeholder-val="{{ true }}">
<div role="dialog" aria-label="Report a hazard" style="position:absolute;left:0;right:0;bottom:0;background:{{t.sheet}};border-radius:32px 32px 0 0;box-shadow:{{t.sheetSh}};padding:8px 20px 28px;box-sizing:border-box;display:flex;flex-direction:column">
<div style="width:36px;height:5px;border-radius:3px;background:{{t.handle}};align-self:center"></div>
<div style="margin-top:14px;display:flex;align-items:center;justify-content:space-between">
<h1 style="margin:0;font-size:24px;line-height:30px;font-weight:650;letter-spacing:-.02em;color:{{t.tx}}">What’s happening?</h1>
<button aria-label="Close" style="width:40px;height:40px;border-radius:50%;border:0;background:{{t.sf2}};display:flex;align-items:center;justify-content:center">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
</button>
</div>
<div role="radiogroup" aria-label="Hazard type" style="margin-top:20px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px 8px">
<sc-for list="{{t.cats}}" as="c" hint-placeholder-count="6">
<button role="radio" aria-checked="{{c.checked}}" style="border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center;gap:8px">
<span style="width:64px;height:64px;border-radius:50%;background:{{c.bg}};box-shadow:{{c.ring}};display:flex;align-items:center;justify-content:center">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="{{c.fg}}" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{c.d}}"/></svg>
</span>
<span style="font-size:13px;font-weight:{{c.fw}};color:{{c.lab}}">{{c.label}}</span>
</button>
</sc-for>
</div>
<button style="margin-top:24px;height:64px;border-radius:20px;border:1px solid {{t.bd}};background:{{t.sf}};display:flex;align-items:center;gap:12px;padding:0 8px 0 14px;text-align:left">
<span style="width:40px;height:40px;border-radius:12px;background:{{t.acs}};display:flex;align-items:center;justify-content:center;flex-shrink:0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="{{t.ac}}" stroke="{{t.ac}}" stroke-width="1.5" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 21 3l-8 18-2-8z"/></svg>
</span>
<span style="flex:1;min-width:0;display:flex;flex-direction:column;gap:1px">
<span style="font-size:15px;font-weight:600;color:{{t.tx}}">Near Jyothi Circle</span>
<span style="font-size:12px;color:{{t.tx3}}">Your location · asked only now</span>
</span>
<span style="height:44px;padding:0 12px;display:flex;align-items:center;font-size:14px;font-weight:600;color:{{t.ac}}">Change</span>
</button>
<div style="margin-top:12px;display:flex;gap:10px">
<label style="flex:1;min-width:0;height:56px;border-radius:20px;border:1px solid {{t.bd}};background:{{t.sf}};display:flex;align-items:center;padding:0 16px;box-sizing:border-box">
<span style="position:absolute;width:1px;height:1px;overflow:hidden">Add a detail</span>
<input placeholder="Add a detail · optional" maxlength="300" style="width:100%;border:0;outline:0;background:transparent;font-size:15px;color:{{t.tx}}"/>
</label>
<button aria-label="Add a photo, can raise trust to L5" style="width:56px;height:56px;border-radius:20px;border:1px dashed {{t.tx3}};background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;flex-shrink:0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="{{t.tx}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4zM8.5 13a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0-7 0"/></svg>
<span style="font-size:9px;font-weight:700;color:{{t.ac}}">L5</span>
</button>
</div>
<div style="margin-top:16px;display:flex;align-items:center;gap:10px;padding:0 4px">
<span style="display:flex;align-items:flex-end;gap:2px;height:12px">
<sc-for list="{{t.bars}}" as="b" hint-placeholder-count="6"><span style="width:3px;height:{{b.h}}px;border-radius:1px;background:{{b.c}}"></span></sc-for>
</span>
<span style="font-size:12px;line-height:16px;color:{{t.tx3}}">Starts as a single report. Rises as others confirm.</span>
</div>
<button style="margin-top:20px;height:56px;border-radius:18px;border:0;background:{{t.ac}};color:{{t.onac}};font-size:17px;font-weight:600">Send report</button>
</div>
</sc-if>

<sc-if value="{{t.sent}}" hint-placeholder-val="{{ false }}">
<div role="dialog" aria-label="Report sent" style="position:absolute;left:0;right:0;bottom:0;background:{{t.sheet}};border-radius:32px 32px 0 0;box-shadow:{{t.sheetSh}};padding:8px 24px 28px;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;text-align:center">
<div style="width:36px;height:5px;border-radius:3px;background:{{t.handle}}"></div>
<div style="margin-top:32px;position:relative;width:88px;height:88px">
<span class="rp-ring" style="position:absolute;inset:0;border-radius:50%;border:2px solid {{t.ac}}"></span>
<span class="rp-pop" style="position:absolute;inset:0;border-radius:50%;background:{{t.ac}};display:flex;align-items:center;justify-content:center">
<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="{{t.onac}}" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path class="rp-check" d="m5 12.5 4.5 4.5L19 7.5"/></svg>
</span>
</div>
<h1 class="rp-rise" style="margin:24px 0 0;font-size:26px;line-height:32px;font-weight:650;letter-spacing:-.02em;color:{{t.tx}};animation-delay:700ms">Report sent</h1>
<p class="rp-rise" style="margin:6px 0 0;font-size:15px;line-height:21px;color:{{t.tx2}};animation-delay:760ms">Flooding near Jyothi Circle · thank you</p>
<div class="rp-rise" style="margin-top:24px;width:100%;border-radius:20px;background:{{t.sf}};border:1px solid {{t.bd}};padding:16px;box-sizing:border-box;display:flex;align-items:center;gap:14px;text-align:left;animation-delay:820ms">
<span style="height:32px;padding:0 10px;border-radius:16px;background:{{t.sf2}};display:flex;align-items:center;gap:6px;flex-shrink:0">
<span style="display:flex;align-items:flex-end;gap:2px;height:12px">
<sc-for list="{{t.bars}}" as="b" hint-placeholder-count="6"><span style="width:3px;height:{{b.h}}px;border-radius:1px;background:{{b.c}}"></span></sc-for>
</span>
<span style="font-size:12px;font-weight:700;color:{{t.tx}}">L1</span>
</span>
<span style="display:flex;flex-direction:column;gap:2px"><span style="font-size:14px;font-weight:600;color:{{t.tx}}">Visible to nearby commuters</span><span style="font-size:12px;line-height:16px;color:{{t.tx3}}">Trust rises as others confirm it</span></span>
</div>
<a href="05-live-map.html" class="rp-rise" style="margin-top:24px;width:100%;height:56px;border-radius:18px;background:{{t.ac}};color:{{t.onac}};font-size:17px;font-weight:600;display:flex;align-items:center;justify-content:center;animation-delay:880ms">View on map</a>
<div class="rp-rise" style="margin-top:10px;width:100%;display:flex;gap:10px;animation-delay:920ms">
<button style="flex:1;height:48px;border-radius:16px;border:0;background:transparent;color:{{t.tx}};font-size:15px;font-weight:600">Done</button>
<button style="flex:1;height:48px;border-radius:16px;border:0;background:transparent;color:{{t.tx2}};font-size:15px;font-weight:600">Undo · 10 s</button>
</div>
</div>
</sc-if>

</div>
</div>
</sc-for>
</div>
</template>
<template id="tpl-MapBase">
<div style="width:100%;height:100%;overflow:hidden;background:{{c.land}};font-family:Inter,system-ui,sans-serif">
<svg width="100%" height="100%" viewBox="0 {{vy}} 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of central Mangaluru">
<rect y="-300" width="390" height="1444" fill="{{c.land}}"/>
<ellipse cx="300" cy="250" rx="42" ry="28" fill="{{c.park}}"/>
<ellipse cx="128" cy="575" rx="32" ry="20" fill="{{c.park}}"/>
<ellipse cx="345" cy="520" rx="26" ry="36" fill="{{c.park}}"/>
<path d="M0 -300H80C66 -100 60 0 72 0C60 120 84 220 66 330C52 430 80 520 60 640C48 720 72 790 58 844C50 950 66 1050 60 1144H0Z" fill="{{c.water}}"/>
<path d="M66 170C140 150 200 190 260 160S360 120 390 140" stroke="{{c.water}}" stroke-width="16" fill="none"/>
<path d="M60 700C140 676 200 728 280 706S360 656 390 676" stroke="{{c.water}}" stroke-width="34" fill="none"/>
<g stroke="{{c.road}}" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M90 262H360M100 384H380M110 522H370M84 610H360M150 110V660M210 130V680M330 200V640M90 444C180 432 260 472 380 452M96 330C160 340 220 320 300 336M120 40H380M100 800H380"/>
</g>
<g fill="none" stroke-linecap="round">
<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.major}}" stroke-width="6"/>
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" stroke="{{c.major}}" stroke-width="6"/>
</g>
<g opacity="{{trafficOp}}" fill="none" stroke-linecap="round">
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" pathLength="100" stroke="{{c.warn}}" stroke-width="5" stroke-dasharray="0 22 20 100"/>
<path d="M250 0C240 140 300 260 290 400S330 600 300 844" pathLength="100" stroke="{{c.danger}}" stroke-width="5" stroke-dasharray="0 38 10 100"/>
<path d="M250 0C240 140 300 260 290 400S330 600 300 844" pathLength="100" stroke="{{c.warn}}" stroke-width="5" stroke-dasharray="0 48 12 100"/>
</g>
<g font-size="11" font-weight="500" fill="{{c.label}}" letter-spacing=".01em">
<text x="168" y="232">Urwa</text>
<text x="98" y="300">Ladyhill</text>
<text x="300" y="282">Bejai</text>
<text x="232" y="356">Kadri</text>
<text x="96" y="500">Hampankatta</text>
<text x="226" y="560">Kankanady</text>
<text x="300" y="636">Pumpwell</text>
<text x="118" y="752">Bolar</text>
<text x="146" y="418" font-size="14" font-weight="600">Mangaluru</text>
</g>

<g opacity="{{routeOp}}" fill="none" stroke-linecap="round">
<path d="M140 478C140 420 180 360 230 330S270 300 282 300" stroke="{{c.casingRoute}}" stroke-width="9"/>
<path d="M140 478C140 420 180 360 230 330S270 300 282 300" stroke="{{c.alt}}" stroke-width="5"/>
<path d="M140 478C170 470 190 440 215 420S250 330 282 300" stroke="{{c.casingRoute}}" stroke-width="12"/>
<path d="M140 478C170 470 190 440 215 420S250 330 282 300" stroke="{{c.route}}" stroke-width="7"/>
<circle cx="140" cy="478" r="8" fill="{{c.casingRoute}}" stroke="{{c.route}}" stroke-width="4"/>
<g transform="translate(282 300)">
<path d="M0 0C-3-5-11-11-11-19A11 11 0 1 1 11-19C11-11 3-5 0 0Z" fill="{{c.ink}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<circle cy="-19" r="4" fill="{{c.casingRoute}}"/>
</g>
</g>
<g opacity="{{bubbleOp}}" font-size="12" font-weight="600">
<rect x="226" y="400" width="62" height="26" rx="13" fill="{{c.route}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<text x="257" y="417.5" text-anchor="middle" fill="{{c.onRoute}}">18 min</text>
<rect x="104" y="340" width="62" height="26" rx="13" fill="{{c.bubble}}" stroke="{{c.bubbleBd}}" stroke-width="1"/>
<text x="135" y="357.5" text-anchor="middle" fill="{{c.ink}}">21 min</text>
<g transform="translate(206 432)">
<circle r="10" fill="{{c.warn}}" stroke="{{c.casingRoute}}" stroke-width="2.5"/>
<path d="M0-5v5M0 3.5v.5" stroke="{{c.casingRoute}}" stroke-width="2.2" stroke-linecap="round"/>
</g>
</g>

<g opacity="{{pinOp}}">
<g transform="translate(262 380)">
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.danger}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M-4.5-20h9" stroke="{{c.casingRoute}}" stroke-width="2.2" stroke-linecap="round"/>
</g>
<g transform="translate(176 604)">
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.neutral}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M-2-25h4l3 9h-10z" fill="none" stroke="{{c.casingRoute}}" stroke-width="1.8" stroke-linejoin="round"/>
</g>
<g transform="translate(212 505) scale(1.3)">
<ellipse cy="1" rx="6" ry="2" fill="{{c.ink}}" opacity=".18"/>
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.warn}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M0-27s4.5 4.5 4.5 7.5a4.5 4.5 0 0 1-9 0c0-3 4.5-7.5 4.5-7.5z" fill="{{c.casingRoute}}"/>
</g>
</g>
<g opacity="{{youOp}}">
<path d="M150 528 168 520 186 528 176 494H160Z" fill="{{c.route}}" opacity=".16" transform="rotate(200 168 520)"/>
<circle cx="168" cy="520" r="9" fill="{{c.route}}" stroke="{{c.casingRoute}}" stroke-width="3.5"/>
</g>
</svg>
</div>
</template>
<script src="../runtime/ts-runtime.js"></script>
<script>
TS.define('Report', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const T = {
      light:{dark:false,name:'Light',bg:'#F5F6F7',sf:'#FFFFFF',sf2:'#EEF0F2',bd:'#E2E5E8',tx:'#121619',tx2:'#4B555E',tx3:'#68737D',ac:'#0B6B5F',acs:'#E2F0ED',onac:'#FFFFFF',frame:'#D9DDE1',sheet:'#FFFFFF',handle:'#D3D8DC',scrim:'rgba(245,246,247,.15)',pinBd:'#FFFFFF',shSm:'0 1px 2px rgba(16,24,32,.08), 0 4px 12px rgba(16,24,32,.10)',sheetSh:'0 -1px 0 rgba(16,24,32,.04), 0 -16px 40px rgba(16,24,32,.14)'},
      dark:{dark:true,name:'Dark',bg:'#0B0F10',sf:'#13181A',sf2:'#1B2124',bd:'#252D30',tx:'#EEF2F3',tx2:'#A9B4B8',tx3:'#8A969B',ac:'#56C7B3',acs:'#0F2C28',onac:'#03211C',frame:'#252D30',sheet:'#101516',handle:'#3A4448',scrim:'rgba(0,0,0,.2)',pinBd:'#0B0F10',shSm:'0 4px 12px rgba(0,0,0,.5)',sheetSh:'0 -1px 0 rgba(255,255,255,.06), 0 -16px 40px rgba(0,0,0,.55)'}
    };
    const C = [
      {label:'Accident',d:'M8 3h8l5 5v8l-5 5H8l-5-5V8zM12 8v5M12 16h.01'},
      {label:'Closed',d:'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M7 12h10'},
      {label:'Traffic',d:'M5 16h14v-4l-2-5H7l-2 5v4zM5 12h14M7 16v2M17 16v2'},
      {label:'Flooding',d:'M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z',sel:true},
      {label:'Road works',d:'M10 4h4l5 16H5L10 4zM8 11h8M6.5 16h11M3 20h18'},
      {label:'Other',d:'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 8v5M12 16h.01'}
    ];
    const make = (t, sent) => ({
      ...t,
      label: t.name + (sent ? ' · sent' : ' · compose'),
      compose: !sent, sent,
      pinLabel: sent ? 'Your report' : 'Report here',
      cats: C.map(c => ({
        ...c,
        checked: c.sel ? 'true' : 'false',
        bg: c.sel ? t.ac : t.sf2, fg: c.sel ? t.onac : t.tx,
        ring: c.sel ? '0 0 0 4px ' + t.acs : 'none',
        lab: c.sel ? t.tx : t.tx2, fw: c.sel ? 600 : 500
      })),
      bars: [4,6,8,10,12,14].map((h,k) => ({h, c: k < 1 ? t.ac : t.bd}))
    });
    return { phones: [make(T.light,false), make(T.dark,false), make(T.light,true), make(T.dark,true)] };
  }
}
return Component;
}, 'tpl-Report');
TS.define('MapBase', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const scene = this.props.scene ?? 'traffic';
    const c = dark
      ? { land:'#121618', park:'#142019', water:'#0C1B22', road:'#1F2528', casing:'#121618', major:'#343C41', label:'#7C878E', route:'#56C7B3', onRoute:'#03211C', casingRoute:'#0B0F10', alt:'#4E595F', warn:'#F2AA55', danger:'#F7897D', neutral:'#A9B4B8', ink:'#EEF2F3', bubble:'#1B2124', bubbleBd:'#2E373B' }
      : { land:'#F2F3F0', park:'#E1EADB', water:'#CFE0E9', road:'#FFFFFF', casing:'#DDE0DA', major:'#FFFFFF', label:'#6B757E', route:'#0B6B5F', onRoute:'#FFFFFF', casingRoute:'#FFFFFF', alt:'#A3ACB3', warn:'#D27A12', danger:'#CC3B2E', neutral:'#4B555E', ink:'#121619', bubble:'#FFFFFF', bubbleBd:'#D5D9DD' };
    return {
      c,
      vy: this.props.offset ?? 0,
      routeOp: scene === 'route' || scene === 'preview' ? 1 : 0,
      bubbleOp: scene === 'route' ? 1 : 0,
      pinOp: scene === 'traffic' ? 1 : 0,
      trafficOp: scene === 'traffic' || scene === 'route' ? 1 : 0,
      youOp: scene === 'traffic' ? 1 : 0
    };
  }
}
return Component;
}, 'tpl-MapBase');
TS.mount('Report', document.getElementById('app'));
</script>
</body>
</html>

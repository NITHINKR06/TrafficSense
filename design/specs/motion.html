<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TrafficSense · Motion spec</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0} table{border-collapse:collapse} button{font-family:inherit;cursor:pointer}
.mv-sheet{transition:transform 420ms cubic-bezier(.32,.72,0,1)}
.mv-pin{transition:transform 300ms cubic-bezier(.34,1.56,.64,1)}
.mv-card{transition:opacity 240ms cubic-bezier(0,0,0,1),transform 240ms cubic-bezier(0,0,0,1)}
</style>

<style>body{margin:0}</style>
<style>html,body{margin:0;background:#E8EBEE}#app{display:inline-block;min-width:100%}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-MotionSpec">
<div style="width:1440px;height:1060px;box-sizing:border-box;padding:56px;background:#F5F6F7;font-family:Inter,system-ui,sans-serif;color:#121619;display:flex;flex-direction:column;gap:32px">

<div style="display:flex;align-items:flex-end;justify-content:space-between">
<div>
<div style="font-size:13px;font-weight:600;color:#0B6B5F;letter-spacing:.04em;text-transform:uppercase">Foundations</div>
<h1 style="margin:6px 0 0;font-size:40px;line-height:46px;font-weight:650;letter-spacing:-.025em">Motion</h1>
<p style="margin:8px 0 0;font-size:16px;color:#4B555E">Quick, calm, and always tied to a touch. Things move from where they came from.</p>
</div>
<div style="display:flex;gap:8px">
<sc-for list="{{durations}}" as="d" hint-placeholder-count="5">
<span style="height:56px;padding:0 14px;border-radius:16px;background:#FFFFFF;box-shadow:0 0 0 1px #E2E5E8;display:flex;flex-direction:column;justify-content:center"><span style="font-size:16px;font-weight:650;font-variant-numeric:tabular-nums">{{d.ms}}</span><span style="font-size:12px;color:#4B555E">{{d.name}}</span></span>
</sc-for>
</div>
</div>

<div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px">
<sc-for list="{{curves}}" as="c" hint-placeholder-count="4">
<div style="border-radius:24px;background:#FFFFFF;box-shadow:0 0 0 1px #E2E5E8;padding:20px;display:flex;flex-direction:column;gap:12px">
<div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:15px;font-weight:600">{{c.name}}</span><span style="font-size:12px;color:#0B6B5F;font-weight:600;font-variant-numeric:tabular-nums">{{c.vals}}</span></div>
<svg width="100%" height="120" viewBox="-10 -10 220 160" preserveAspectRatio="none" role="img" aria-label="{{c.name}} easing curve">
<path d="M0 140H200M0 0V140" stroke="#E2E5E8" stroke-width="1" fill="none"/>
<path d="M0 140L200 0" stroke="#E2E5E8" stroke-width="1" stroke-dasharray="3 4" fill="none"/>
<path d="{{c.d}}" stroke="#0B6B5F" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
<span style="font-size:13px;color:#4B555E">{{c.use}}</span>
</div>
</sc-for>
</div>

<div style="display:flex;gap:32px;flex:1;min-height:0">
<div style="flex:1;border-radius:28px;background:#FFFFFF;box-shadow:0 0 0 1px #E2E5E8;padding:24px 28px">
<div style="font-size:13px;font-weight:600;color:#4B555E;margin-bottom:8px">Patterns</div>
<div style="display:flex;flex-direction:column;width:100%;font-size:14px">
<sc-for list="{{patterns}}" as="m" hint-placeholder-count="8">
<div style="display:flex;align-items:center;border-top:1px solid #EEF0F2"><div style="flex:none;padding:10px 12px 10px 0;font-weight:600;width:24%">{{m.k}}</div><div style="flex:1;min-width:0;padding:10px 12px 10px 0;color:#4B555E">{{m.what}}</div><div style="flex:none;padding:10px 0;font-size:13px;color:#0B6B5F;font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums">{{m.t}}</div></div>
</sc-for>
</div>
</div>

<div style="width:520px;border-radius:28px;background:#FFFFFF;box-shadow:0 0 0 1px #E2E5E8;padding:24px 28px;display:flex;flex-direction:column;gap:14px">
<span style="font-size:13px;font-weight:600;color:#4B555E">Try it</span>
<div style="display:flex;gap:20px">
<div style="display:flex;flex-direction:column;gap:10px;align-items:center">
<div style="position:relative;width:200px;height:320px;border-radius:28px;overflow:hidden;box-shadow:0 0 0 1px #E2E5E8;background:#F2F3F0">
<div style="position:absolute;left:-95px;top:-260px;width:390px;height:844px"><dc-import name="MapBase" dark="{{ false }}" scene="traffic" hint-size="390px,844px"></dc-import></div>
<div class="mv-sheet" style="position:absolute;left:0;right:0;top:0;height:320px;background:#FFFFFF;border-radius:20px 20px 0 0;box-shadow:0 -8px 24px rgba(16,24,32,.12);transform:{{sheetTf}};padding:8px 14px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px">
<span style="width:28px;height:4px;border-radius:2px;background:#D3D8DC;align-self:center"></span>
<span style="font-size:14px;font-weight:650">Nearby · 3</span>
<span style="height:44px;border-radius:12px;background:#F5F6F7"></span>
<span style="height:44px;border-radius:12px;background:#F5F6F7"></span>
<span style="height:44px;border-radius:12px;background:#F5F6F7"></span>
</div>
</div>
<button onClick="{{toggleSheet}}" style="height:40px;padding:0 16px;border-radius:20px;border:0;background:#E2F0ED;color:#0B6B5F;font-size:13px;font-weight:600">{{sheetLabel}}</button>
</div>
<div style="flex:1;display:flex;flex-direction:column;gap:10px;align-items:center">
<div style="position:relative;width:100%;height:150px;border-radius:20px;background:#F2F3F0;box-shadow:0 0 0 1px #E2E5E8;display:flex;align-items:center;justify-content:center">
<svg class="mv-pin" width="40" height="50" viewBox="-14 -36 28 38" style="transform:{{pinTf}};transform-origin:50% 100%" role="img" aria-label="Map pin">
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="#D27A12" stroke="#FFFFFF" stroke-width="2"/>
<path d="M0-27s4.5 4.5 4.5 7.5a4.5 4.5 0 0 1-9 0c0-3 4.5-7.5 4.5-7.5z" fill="#FFFFFF"/>
</svg>
</div>
<button onClick="{{togglePin}}" style="height:40px;padding:0 16px;border-radius:20px;border:0;background:#E2F0ED;color:#0B6B5F;font-size:13px;font-weight:600">Select pin</button>
<div style="position:relative;width:100%;height:110px;display:flex;flex-direction:column;gap:8px;margin-top:6px">
<sc-for list="{{cards}}" as="k" hint-placeholder-count="2">
<span class="mv-card" style="height:44px;border-radius:12px;background:#FFFFFF;box-shadow:0 0 0 1px #E2E5E8;opacity:{{k.op}};transform:{{k.tf}};transition-delay:{{k.delay}}"></span>
</sc-for>
</div>
<button onClick="{{toggleCards}}" style="height:40px;padding:0 16px;border-radius:20px;border:0;background:#E2F0ED;color:#0B6B5F;font-size:13px;font-weight:600">Replay cards</button>
</div>
</div>
</div>
</div>

</div>
</template>
<template id="tpl-MapBase">
<div style="width:100%;height:100%;overflow:hidden;background:{{c.land}};font-family:Inter,system-ui,sans-serif">
<svg width="100%" height="100%" viewBox="0 {{vy}} 390 844" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Map of central Mangaluru">
<rect y="-300" width="390" height="1444" fill="{{c.land}}"/>
<ellipse cx="300" cy="250" rx="42" ry="28" fill="{{c.park}}"/>
<ellipse cx="128" cy="575" rx="32" ry="20" fill="{{c.park}}"/>
<ellipse cx="345" cy="520" rx="26" ry="36" fill="{{c.park}}"/>
<path d="M0 -300H80C66 -100 60 0 72 0C60 120 84 220 66 330C52 430 80 520 60 640C48 720 72 790 58 844C50 950 66 1050 60 1144H0Z" fill="{{c.water}}"/>
<path d="M66 170C140 150 200 190 260 160S360 120 390 140" stroke="{{c.water}}" stroke-width="16" fill="none"/>
<path d="M60 700C140 676 200 728 280 706S360 656 390 676" stroke="{{c.water}}" stroke-width="34" fill="none"/>
<g stroke="{{c.road}}" stroke-width="3" fill="none" stroke-linecap="round">
<path d="M90 262H360M100 384H380M110 522H370M84 610H360M150 110V660M210 130V680M330 200V640M90 444C180 432 260 472 380 452M96 330C160 340 220 320 300 336M120 40H380M100 800H380"/>
</g>
<g fill="none" stroke-linecap="round">
<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" stroke="{{c.casing}}" stroke-width="10"/>
<path d="M250 -300C250 -100 248 -60 250 0C240 140 300 260 290 400S330 600 300 844S310 1000 300 1144" stroke="{{c.major}}" stroke-width="6"/>
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" stroke="{{c.major}}" stroke-width="6"/>
</g>
<g opacity="{{trafficOp}}" fill="none" stroke-linecap="round">
<path d="M80 600C160 560 220 480 250 420S300 300 390 300" pathLength="100" stroke="{{c.warn}}" stroke-width="5" stroke-dasharray="0 22 20 100"/>
<path d="M250 0C240 140 300 260 290 400S330 600 300 844" pathLength="100" stroke="{{c.danger}}" stroke-width="5" stroke-dasharray="0 38 10 100"/>
<path d="M250 0C240 140 300 260 290 400S330 600 300 844" pathLength="100" stroke="{{c.warn}}" stroke-width="5" stroke-dasharray="0 48 12 100"/>
</g>
<g font-size="11" font-weight="500" fill="{{c.label}}" letter-spacing=".01em">
<text x="168" y="232">Urwa</text>
<text x="98" y="300">Ladyhill</text>
<text x="300" y="282">Bejai</text>
<text x="232" y="356">Kadri</text>
<text x="96" y="500">Hampankatta</text>
<text x="226" y="560">Kankanady</text>
<text x="300" y="636">Pumpwell</text>
<text x="118" y="752">Bolar</text>
<text x="146" y="418" font-size="14" font-weight="600">Mangaluru</text>
</g>

<g opacity="{{routeOp}}" fill="none" stroke-linecap="round">
<path d="M140 478C140 420 180 360 230 330S270 300 282 300" stroke="{{c.casingRoute}}" stroke-width="9"/>
<path d="M140 478C140 420 180 360 230 330S270 300 282 300" stroke="{{c.alt}}" stroke-width="5"/>
<path d="M140 478C170 470 190 440 215 420S250 330 282 300" stroke="{{c.casingRoute}}" stroke-width="12"/>
<path d="M140 478C170 470 190 440 215 420S250 330 282 300" stroke="{{c.route}}" stroke-width="7"/>
<circle cx="140" cy="478" r="8" fill="{{c.casingRoute}}" stroke="{{c.route}}" stroke-width="4"/>
<g transform="translate(282 300)">
<path d="M0 0C-3-5-11-11-11-19A11 11 0 1 1 11-19C11-11 3-5 0 0Z" fill="{{c.ink}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<circle cy="-19" r="4" fill="{{c.casingRoute}}"/>
</g>
</g>
<g opacity="{{bubbleOp}}" font-size="12" font-weight="600">
<rect x="226" y="400" width="62" height="26" rx="13" fill="{{c.route}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<text x="257" y="417.5" text-anchor="middle" fill="{{c.onRoute}}">18 min</text>
<rect x="104" y="340" width="62" height="26" rx="13" fill="{{c.bubble}}" stroke="{{c.bubbleBd}}" stroke-width="1"/>
<text x="135" y="357.5" text-anchor="middle" fill="{{c.ink}}">21 min</text>
<g transform="translate(206 432)">
<circle r="10" fill="{{c.warn}}" stroke="{{c.casingRoute}}" stroke-width="2.5"/>
<path d="M0-5v5M0 3.5v.5" stroke="{{c.casingRoute}}" stroke-width="2.2" stroke-linecap="round"/>
</g>
</g>

<g opacity="{{pinOp}}">
<g transform="translate(262 380)">
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.danger}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M-4.5-20h9" stroke="{{c.casingRoute}}" stroke-width="2.2" stroke-linecap="round"/>
</g>
<g transform="translate(176 604)">
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.neutral}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M-2-25h4l3 9h-10z" fill="none" stroke="{{c.casingRoute}}" stroke-width="1.8" stroke-linejoin="round"/>
</g>
<g transform="translate(212 505) scale(1.3)">
<ellipse cy="1" rx="6" ry="2" fill="{{c.ink}}" opacity=".18"/>
<path d="M0 0C-3-5-12-11-12-20A12 12 0 1 1 12-20C12-11 3-5 0 0Z" fill="{{c.warn}}" stroke="{{c.casingRoute}}" stroke-width="2"/>
<path d="M0-27s4.5 4.5 4.5 7.5a4.5 4.5 0 0 1-9 0c0-3 4.5-7.5 4.5-7.5z" fill="{{c.casingRoute}}"/>
</g>
</g>
<g opacity="{{youOp}}">
<path d="M150 528 168 520 186 528 176 494H160Z" fill="{{c.route}}" opacity=".16" transform="rotate(200 168 520)"/>
<circle cx="168" cy="520" r="9" fill="{{c.route}}" stroke="{{c.casingRoute}}" stroke-width="3.5"/>
</g>
</svg>
</div>
</template>
<script src="../runtime/ts-runtime.js"></script>
<script>
TS.define('MotionSpec', function (DCLogic) {
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { half: false, pin: false, cards: true }; }
  renderVals() {
    const curve = (x1,y1,x2,y2) => 'M0 140C' + (x1*200) + ' ' + (140-y1*140) + ' ' + (x2*200) + ' ' + (140-y2*140) + ' 200 0';
    return {
      durations: [
        {ms:'100',name:'Press'},{ms:'160',name:'Fade'},{ms:'240',name:'Base'},{ms:'320',name:'Screen'},{ms:'420',name:'Sheet'}
      ],
      curves: [
        {name:'Standard',vals:'.2, 0, 0, 1',d:curve(.2,0,0,1),use:'Most changes on screen'},
        {name:'Enter',vals:'0, 0, 0, 1',d:curve(0,0,0,1),use:'Things arriving: cards, toasts'},
        {name:'Exit',vals:'.3, 0, 1, 1',d:curve(.3,0,1,1),use:'Things leaving: dismiss, close'},
        {name:'Glide',vals:'.32, .72, 0, 1',d:curve(.32,.72,0,1),use:'Sheets and the tab indicator'}
      ],
      patterns: [
        {k:'Open a screen',what:'Slides in 24 px and fades in',t:'320 · Standard'},
        {k:'Go back',what:'Reverses, a little faster',t:'240 · Exit'},
        {k:'Report sheet',what:'Rises from the + button, scrim to 40%',t:'420 · Glide'},
        {k:'Map sheet',what:'Snaps peek / half / full, follows finger',t:'420 · Glide'},
        {k:'Map controls',what:'Ride the sheet edge, hide above half',t:'with sheet'},
        {k:'Cards appear',what:'Fade + 8 px rise, 40 ms apart, max 5',t:'240 · Enter'},
        {k:'Select a pin',what:'Grows to 1.3× with a small overshoot',t:'300 · spring'},
        {k:'Live update',what:'Timestamp cross-fades, no spinner',t:'160 · fade'},
        {k:'Reduce motion',what:'All movement becomes a short fade',t:'150 · fade'}
      ],
      sheetTf: this.state.half ? 'translateY(120px)' : 'translateY(232px)',
      sheetLabel: this.state.half ? 'Peek' : 'Half',
      toggleSheet: () => this.setState({ half: !this.state.half }),
      pinTf: this.state.pin ? 'scale(1.3)' : 'scale(1)',
      togglePin: () => this.setState({ pin: !this.state.pin }),
      cards: [0,1].map(k => ({
        op: this.state.cards ? 1 : 0,
        tf: this.state.cards ? 'translateY(0)' : 'translateY(8px)',
        delay: (this.state.cards ? k * 40 : 0) + 'ms'
      })),
      toggleCards: () => {
        this.setState({ cards: false });
        setTimeout(() => this.setState({ cards: true }), 260);
      }
    };
  }
}
return Component;
}, 'tpl-MotionSpec');
TS.define('MapBase', function (DCLogic) {
class Component extends DCLogic {
  renderVals() {
    const dark = !!this.props.dark;
    const scene = this.props.scene ?? 'traffic';
    const c = dark
      ? { land:'#121618', park:'#142019', water:'#0C1B22', road:'#1F2528', casing:'#121618', major:'#343C41', label:'#7C878E', route:'#56C7B3', onRoute:'#03211C', casingRoute:'#0B0F10', alt:'#4E595F', warn:'#F2AA55', danger:'#F7897D', neutral:'#A9B4B8', ink:'#EEF2F3', bubble:'#1B2124', bubbleBd:'#2E373B' }
      : { land:'#F2F3F0', park:'#E1EADB', water:'#CFE0E9', road:'#FFFFFF', casing:'#DDE0DA', major:'#FFFFFF', label:'#6B757E', route:'#0B6B5F', onRoute:'#FFFFFF', casingRoute:'#FFFFFF', alt:'#A3ACB3', warn:'#D27A12', danger:'#CC3B2E', neutral:'#4B555E', ink:'#121619', bubble:'#FFFFFF', bubbleBd:'#D5D9DD' };
    return {
      c,
      vy: this.props.offset ?? 0,
      routeOp: scene === 'route' || scene === 'preview' ? 1 : 0,
      bubbleOp: scene === 'route' ? 1 : 0,
      pinOp: scene === 'traffic' ? 1 : 0,
      trafficOp: scene === 'traffic' || scene === 'route' ? 1 : 0,
      youOp: scene === 'traffic' ? 1 : 0
    };
  }
}
return Component;
}, 'tpl-MapBase');
TS.mount('MotionSpec', document.getElementById('app'));
</script>
</body>
</html>
